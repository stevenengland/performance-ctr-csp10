# The deploy proof (`npm run test:deploy`), imported from projekt2406 without
# its FTPS server and browser tier. Images are pinned by digest.
#
# An SFTP server and Apache share one named volume as the remote root, as on
# Strato. The SFTP user is chrooted to its home and writes under /remote;
# Apache serves /srv/remote/site from the same volume with the rendered
# .htaccess. Slice 1/4 adds PHP and a database for the API release.
services:
  sftp:
    image: atmoz/sftp:alpine@sha256:43dd1c023cf1bae487127d4b54660b0aee6e94c188a6599be36fb89ba115f961
    # Docker creates the volume root as root; hand it to the SFTP user so the
    # deploy can write .deploy/ beside site/.
    entrypoint:
      - sh
      - -c
      - chown 1001:100 /home/deploy/remote && exec /entrypoint "$$@"
      - --
    # user:password:uid:gid:dirs — the dirs are created and chowned at start.
    # site/ must exist before Apache starts: httpd refuses a missing DocumentRoot.
    command: deploy:deploy-test-password:1001:1001:remote,remote/site
    ports:
      - '${DEPLOY_TEST_SFTP_PORT:-2222}:22'
    volumes:
      - remote:/home/deploy/remote
    healthcheck:
      test: ['CMD', 'nc', '-z', 'localhost', '22']
      interval: 1s
      timeout: 2s
      retries: 30
  apache:
    depends_on:
      sftp:
        condition: service_healthy
    image: httpd:2.4-alpine@sha256:759a1d9178d351185978e41be37a3e91675a4ddc0653aa5df493cfd4c67e24ec
    ports:
      - '${DEPLOY_TEST_HTTP_PORT:-8089}:80'
    volumes:
      - remote:/srv/remote:ro
    configs:
      - source: httpd
        target: /usr/local/apache2/conf/httpd.conf
    healthcheck:
      test: ['CMD', 'nc', '-z', 'localhost', '80']
      interval: 1s
      timeout: 2s
      retries: 30
volumes:
  remote:
configs:
  # The modules the rendered .htaccess needs, as on the shared host.
  httpd:
    content: |
      ServerRoot "/usr/local/apache2"
      LoadModule mpm_event_module modules/mod_mpm_event.so
      LoadModule authn_core_module modules/mod_authn_core.so
      LoadModule authz_core_module modules/mod_authz_core.so
      LoadModule mime_module modules/mod_mime.so
      LoadModule log_config_module modules/mod_log_config.so
      LoadModule headers_module modules/mod_headers.so
      LoadModule rewrite_module modules/mod_rewrite.so
      LoadModule dir_module modules/mod_dir.so
      LoadModule unixd_module modules/mod_unixd.so
      User daemon
      Group daemon
      ServerName localhost
      <Directory />
        AllowOverride None
        Require all denied
      </Directory>
      <Files ".ht*">
        Require all denied
      </Files>
      DirectoryIndex index.html
      TypesConfig conf/mime.types
      ErrorLog /proc/self/fd/2
      LogLevel warn
      Listen 80
      DocumentRoot "/srv/remote/site"
      <Directory "/srv/remote/site">
        Options -Indexes
        AllowOverride All
        Require all granted
      </Directory>
