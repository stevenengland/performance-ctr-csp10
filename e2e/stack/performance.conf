# The webspace as on the host: the served folder `site/` beside `app/` (PHP
# releases), `config/runtime.php` (runtime configuration) and the deploy's
# `.deploy/`, all under one root that Apache never serves.
Listen 8080
<VirtualHost *:8080>
  ServerName localhost
  DocumentRoot /srv/performance/site
  <Directory /srv/performance/site>
    Options -Indexes
    AllowOverride All
    Require all granted
  </Directory>
  <Directory /srv/performance>
    Require all denied
  </Directory>
  ErrorLog ${APACHE_LOG_DIR}/performance-error.log
  CustomLog ${APACHE_LOG_DIR}/performance-access.log combined
</VirtualHost>
