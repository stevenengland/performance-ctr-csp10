# Containerised stand-in for the webspace: Apache + PHP serving the built
# artifact with the rendered .htaccess, and MySQL. PHP (Dockerfile) and MySQL
# are pinned by digest to the PROVISIONAL host versions (docs/runbook-deploy.md,
# "Runtime pins"): swap them when the host probe (#2) reports.
#
# STACK_ROOT is a folder laid out as on the host:
#   site/                artifact web/ plus the rendered .htaccess
#   app/                 artifact app/
#   config/runtime.php   runtime configuration (see e2e/stack/config.php)
services:
  db:
    # mysql:8.4 (8.4.13), provisional pin
    image: mysql:8.4@sha256:a81d043930e51745522bd5c430961cf8286f0a23f0a9a2a6e0108f7ea71b0902
    environment:
      MYSQL_DATABASE: performance
      MYSQL_USER: performance
      MYSQL_PASSWORD: performance
      MYSQL_RANDOM_ROOT_PASSWORD: 'yes'
    healthcheck:
      test:
        [
          'CMD',
          'mysqladmin',
          'ping',
          '-h',
          '127.0.0.1',
          '-uperformance',
          '-pperformance',
        ]
      interval: 2s
      timeout: 2s
      retries: 60
  web:
    build: .
    depends_on:
      db:
        condition: service_healthy
    ports:
      - '${STACK_PORT:-8080}:8080'
    volumes:
      - '${STACK_ROOT:?set STACK_ROOT to the staged webspace}:/srv/performance:ro'
