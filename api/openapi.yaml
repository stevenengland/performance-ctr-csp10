openapi: 3.1.0
info:
  title: Performance API
  version: 0.3.0
  description: >-
    JSON API of the Performance drink counter. Fields are camelCase, timestamps
    ISO-8601 UTC, decimals JSON numbers rounded to two places. Every error is
    `application/problem+json` (RFC 9457) with a stable `urn:performance:problem:*`
    type. While a migration runs, every route except health answers 503 with
    `Retry-After`; after a failed migration it answers 503 without it.

    The web client names its app version in `X-Client-Version` on every request.
    Every route except health refuses a client below health's `minClientVersion`
    with 400 `client-outdated` before it processes anything; the client then
    shows `Bitte neu laden`. A request without the header counts as version
    0.1.0, the last client that sent none, so it is refused once the floor
    passes 0.1.0, as it has since 0.3.0. (Not 426: that status requires an
    `Upgrade` protocol, and an app version is none.)

    Every route except health and sign-in requires the session cookie that
    sign-in sets (`HttpOnly; Secure; SameSite=Strict`, 180 days, renewed on
    use at most once a day: only then does a response set the cookie again) and
    answers 401 without a valid one. Request bodies must be
    `application/json` (415 otherwise).

    Every answer carries `Cache-Control: no-store`, except a served person photo
    (`GET /api/persons/{id}/photo?v=`), which may be cached for good.
servers:
  - url: /
security:
  - session: []
paths:
  /api/health:
    get:
      operationId: getHealth
      summary: Versions, schema and migration state; brings the schema up to date first
      security: []
      responses:
        '200':
          description: The installation's health
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
        '500':
          $ref: '#/components/responses/Problem'
  /api/session:
    parameters:
      - $ref: '#/components/parameters/ClientVersion'
    post:
      operationId: signIn
      summary: Sign in; creates the bootstrap admin first when no admin exists
      description: >-
        Sets the session cookie. After five failed sign-ins for the same user name
        and client address within 15 minutes, answers 429 until the window passes.
        An unknown user name and a wrong password get the same answer.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignIn'
      responses:
        '200':
          description: Signed in
          headers:
            Set-Cookie:
              description: '`session=<token>; Path=/; Max-Age=15552000; HttpOnly; Secure; SameSite=Strict`'
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '415':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/TooManyAttempts'
    get:
      operationId: getSession
      summary: The signed-in account
      responses:
        '200':
          description: The signed-in account
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
        '401':
          $ref: '#/components/responses/Problem'
    delete:
      operationId: signOut
      summary: Sign out; revokes the session on the server and clears the cookie
      responses:
        '204':
          description: Signed out
        '401':
          $ref: '#/components/responses/Problem'
  /api/session/password:
    parameters:
      - $ref: '#/components/parameters/ClientVersion'
    put:
      operationId: changePassword
      summary: Change the own password; signs the account out on every other device
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordChange'
      responses:
        '204':
          description: Changed
        '401':
          $ref: '#/components/responses/Problem'
        '415':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
  /api/accounts:
    parameters:
      - $ref: '#/components/parameters/ClientVersion'
    get:
      operationId: listAccounts
      summary: Every account, by user name (admins only)
      responses:
        '200':
          description: The accounts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountList'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
    post:
      operationId: createAccount
      summary: Create an account (admins only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewAccount'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '415':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
  /api/accounts/{id}:
    parameters:
      - $ref: '#/components/parameters/ClientVersion'
      - name: id
        in: path
        required: true
        description: The account's id; anything but a positive integer is 404
        schema:
          type: integer
          minimum: 1
    patch:
      operationId: updateAccount
      summary: Grant or revoke admin rights, or reset the password (admins only)
      description: >-
        Only the given fields change. A password reset signs the account out on every
        device. Demoting the last admin is refused with 409 and changes nothing;
        concurrent demotions and deletions are serialised by the database.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountChange'
      responses:
        '200':
          description: Changed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '415':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
    delete:
      operationId: deleteAccount
      summary: Delete an account (admins only)
      description: >-
        Its sessions end; the entries it logged stay, without the account
        (`accountName` null), and so do the entries it verified, which keep counting.
        The deletion bumps the data revision, since the pending queue names recorders.
        Deleting the last admin is refused with 409.
      responses:
        '204':
          description: Deleted
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
  /api/persons:
    parameters:
      - $ref: '#/components/parameters/ClientVersion'
    get:
      operationId: listPersons
      summary: Every person, alphabetical (ignoring case)
      responses:
        '200':
          description: The persons
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PersonList'
        '401':
          $ref: '#/components/responses/Problem'
    post:
      operationId: createPerson
      summary: Create a person
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewPerson'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Person'
        '401':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '415':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
  /api/persons/{id}:
    parameters:
      - $ref: '#/components/parameters/ClientVersion'
      - name: id
        in: path
        required: true
        description: The person's id; anything but a positive integer is 404
        schema:
          type: integer
          minimum: 1
    get:
      operationId: getPerson
      summary: A person with the number of their entries, matches and results (for the delete dialog)
      responses:
        '200':
          description: The person
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PersonDetail'
        '401':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
    patch:
      operationId: updatePerson
      summary: Rename a person
      description: >-
        Validated like creating. Scores and lists show the new name from then on.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewPerson'
      responses:
        '200':
          description: Changed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Person'
        '401':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '415':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
    delete:
      operationId: deletePerson
      summary: Delete a person with all of their entries and results; their matches stay with that side cleared
      description: >-
        Every match that names the person keeps its row and outcome with the person's side cleared,
        so the opponent's win, draw or loss still counts; the audit log records one update per such
        match, caused by the person's deletion. The person's results of every game and run are
        deleted with them; the audit log records one deletion per result, caused by the person's.
      responses:
        '204':
          description: Deleted
        '401':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
  /api/persons/{id}/photo:
    parameters:
      - $ref: '#/components/parameters/ClientVersion'
      - name: id
        in: path
        required: true
        description: The person's id; anything but a positive integer is 404
        schema:
          type: integer
          minimum: 1
    get:
      operationId: getPersonPhoto
      summary: A person's photo, by its version
      description: >-
        Served only while `v` is the photo's stored version, the one the server put in the
        person's `photoUrl`; version and bytes are read together, so no URL ever answers another
        version's bytes. Re-uploading an earlier photo gives it its old version, which then
        answers exactly those bytes again. A missing, malformed or stale `v`, a person without
        a photo and an unknown person are all 404. The only API answer that may be cached:
        every other answer of this and every route, every problem included, is `no-store`.
        Browsers load it through `<img>`, which sends the session cookie but no
        `X-Client-Version`; so this `GET`, unlike every other route but health, is never
        refused as `client-outdated`, whatever the client floor (it only reads a
        version-addressed photo).
      parameters:
        - name: v
          in: query
          required: true
          description: The photo's version, the lowercase hex SHA-256 of its stored bytes
          schema:
            type: string
            pattern: '^[0-9a-f]{64}$'
      responses:
        '200':
          description: The stored JPEG, 256 × 256, without metadata
          headers:
            Cache-Control:
              description: '`private, max-age=31536000, immutable`'
              schema:
                type: string
          content:
            image/jpeg:
              schema:
                type: string
                contentMediaType: image/jpeg
        '401':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
    put:
      operationId: putPersonPhoto
      summary: Set or replace a person's photo
      description: >-
        Any member may set the photo of any person. The client crops and scales it to a
        256 × 256 JPEG; the server does not trust that. A body over 98 304 bytes (96 KiB) is
        413 before it is parsed, an `image` over 87 384 characters 422 before it is decoded.
        The server decodes strict base64 and rewrites the JPEG keeping only its image data
        (no EXIF, GPS, XMP, ICC or comments); anything that is not a 256 × 256 JPEG of 1 or 3
        components and at most 64 KiB once rewritten is 422 on `image`. The photo's version is
        the SHA-256 of the stored bytes: the same version again changes nothing, neither the
        data revision nor the audit log. A change bumps the data revision and is recorded as
        an update of the person whose snapshot's `photo` changes. The body is checked before
        the person is looked up, so an invalid image is 422 even for an unknown person; a
        valid one for an unknown person is 404.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewPersonPhoto'
      responses:
        '200':
          description: Set (or unchanged); the person, whose `photoUrl` names the stored version
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Person'
        '401':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '413':
          $ref: '#/components/responses/Problem'
        '415':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
    delete:
      operationId: deletePersonPhoto
      summary: Remove a person's photo
      description: >-
        Any member may remove the photo of any person. Without a photo nothing changes,
        neither the data revision nor the audit log.
      responses:
        '204':
          description: Removed, or there was none
        '401':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
  /api/drinks:
    parameters:
      - $ref: '#/components/parameters/ClientVersion'
    get:
      operationId: listDrinks
      summary: Every drink, alphabetical (ignoring case)
      responses:
        '200':
          description: The drinks
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DrinkList'
        '401':
          $ref: '#/components/responses/Problem'
    post:
      operationId: createDrink
      summary: Create a drink with its alcohol base points
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewDrink'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Drink'
        '401':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '415':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
  /api/drinks/{id}:
    parameters:
      - $ref: '#/components/parameters/ClientVersion'
      - name: id
        in: path
        required: true
        description: The drink's id; anything but a positive integer is 404
        schema:
          type: integer
          minimum: 1
    get:
      operationId: getDrink
      summary: A drink with the number of its entries (for the delete dialog)
      responses:
        '200':
          description: The drink
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DrinkDetail'
        '401':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
    patch:
      operationId: updateDrink
      summary: Change a drink's name and points
      description: >-
        Both fields are required. Scores always use the current points, so the change applies to every entry of the drink.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewDrink'
      responses:
        '200':
          description: Changed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Drink'
        '401':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '415':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
    delete:
      operationId: deleteDrink
      summary: Delete a drink and all of its entries
      responses:
        '204':
          description: Deleted
        '401':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
  /api/factors:
    parameters:
      - $ref: '#/components/parameters/ClientVersion'
    get:
      operationId: listFactors
      summary: Every factor, alphabetical (ignoring case)
      responses:
        '200':
          description: The factors
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FactorList'
        '401':
          $ref: '#/components/responses/Problem'
    post:
      operationId: createFactor
      summary: Create a factor with its multiplier
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewFactor'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Factor'
        '401':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '415':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
  /api/factors/{id}:
    parameters:
      - $ref: '#/components/parameters/ClientVersion'
      - name: id
        in: path
        required: true
        description: The factor's id; anything but a positive integer is 404
        schema:
          type: integer
          minimum: 1
    get:
      operationId: getFactor
      summary: A factor with the number of entries that use it (for the delete dialog)
      responses:
        '200':
          description: The factor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FactorDetail'
        '401':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
    patch:
      operationId: updateFactor
      summary: Change a factor's name and multiplier
      description: >-
        Both fields are required. Scores always use the current multiplier, so the
        change applies to every entry that uses the factor.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewFactor'
      responses:
        '200':
          description: Changed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Factor'
        '401':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '415':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
    delete:
      operationId: deleteFactor
      summary: Delete a factor; its entries stay and count ×1 from then on
      responses:
        '204':
          description: Deleted
        '401':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
  /api/entries:
    parameters:
      - $ref: '#/components/parameters/ClientVersion'
    get:
      operationId: listEntries
      summary: A person's entries in the window `[from, to)`, newest first
      description: >-
        The entries recorded in the window: from `from` on, and before `to` when it is
        given; without `to` the answer is the same as before the window had an end. An
        entry belongs to the window it was recorded in, whenever it was verified. Each
        entry names its drink and its factor (null without one, or once the factor
        was deleted) with their current names, and the user name of the account that
        logged it (null once that account was deleted). A `personId` that is not a positive
        integer is 422; a person that does not exist is 404. An invalid window is 422,
        with the same problem as on `GET /api/scoreboard`.
      parameters:
        - name: personId
          in: query
          required: true
          schema:
            type: integer
            minimum: 1
        - name: from
          in: query
          required: true
          description: >-
            Start of the window (inclusive), such as local midnight of the viewer's day, as
            an ISO-8601 instant with offset
          schema:
            type: string
            format: date-time
            examples: ['2026-11-14T23:00:00.000Z']
        - $ref: '#/components/parameters/WindowTo'
      responses:
        '200':
          description: The entries, newest first
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EntryHistory'
        '401':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
  /api/entries/{id}:
    parameters:
      - $ref: '#/components/parameters/ClientVersion'
      - name: id
        in: path
        required: true
        description: The entry's client-generated UUID v4 (lower case), also the retry key
        schema:
          type: string
          pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$'
    put:
      operationId: addEntry
      summary: Add an entry, idempotently on its id
      description: >-
        The account and the server time (UTC) are recorded with the entry. A repeated
        request with the same id and content (factor included) answers 200 with the
        original entry and creates nothing, even after the entry was deleted; the same
        id with different content answers 409. An unknown factor is 422. Ids are remembered for seven days. Any other id that is not
        a lower-case UUID v4 is 404.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewEntry'
      responses:
        '200':
          description: Already added by an earlier request with this id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Entry'
        '201':
          description: Added
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Entry'
        '401':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '415':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
    delete:
      operationId: deleteEntry
      summary: Delete an entry (undo); its id stays known, so a late retry cannot bring it back
      responses:
        '204':
          description: Deleted
        '401':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
  /api/entries/{id}/verification:
    parameters:
      - $ref: '#/components/parameters/ClientVersion'
      - name: id
        in: path
        required: true
        description: The entry's UUID; anything that is not a lower-case UUID v4 is 404
        schema:
          type: string
          pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$'
    put:
      operationId: verifyEntry
      summary: Verify a pending entry, so that it counts (four-eyes rule)
      description: >-
        Any signed-in account other than the one that recorded the entry may verify it;
        admin rights give no extra right. An entry whose recording account was deleted may
        be verified by any account. The recording account is refused with 403 `own-row` and
        the entry stays pending. Verifying an entry that counts already succeeds again
        without an audit event and without changing the data revision; the first
        verification records a `verify` event with the entry before and after and bumps
        the revision. An entry that no longer exists (deleted, or never recorded) is 404.
        The body is an empty JSON object.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
      responses:
        '204':
          description: The entry counts
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '415':
          $ref: '#/components/responses/Problem'
    delete:
      operationId: rejectEntry
      summary: Reject a pending entry, so that it never counts (four-eyes rule)
      description: >-
        Any signed-in account other than the one that recorded the entry may reject it, by
        the same rule as verifying; an entry whose recording account was deleted may be
        rejected by any account. Rejecting removes the entry and records one `reject` event
        with the entry before, never a `delete`, and bumps the data revision. The recording
        account is refused with 403 `own-row` and withdraws its own entry through
        `DELETE /api/entries/{id}` instead. An entry that counts already is refused with
        409 `already-verified` and stays; only that delete removes it. An entry that no
        longer exists (rejected, deleted, or never recorded) is 404. Its id stays known for
        the seven days of the retry window, so a late retry of the recording cannot bring
        it back.
      responses:
        '204':
          description: The entry is removed
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
  /api/pending:
    parameters:
      - $ref: '#/components/parameters/ClientVersion'
    get:
      operationId: listPending
      summary: A page of the rows the signed-in account may verify, and how many there are
      description: >-
        Every pending row the account may verify, entries, matches and results: recorded by another
        account, or by one deleted since. All days and game runs, newest first by recording instant, then by kind, then by id,
        20 per page. `next` is the `cursor` of the next page (null on the last one); a page
        goes on after the last row of the one before, so rows verified, rejected or deleted
        meanwhile never make later rows unreachable. `count` is the number of all eligible
        rows, whatever the page: the badge of `Offen`. The first page answers
        conditionally: its ETag names the data revision and the account, since every
        account has its own queue, and `If-None-Match` with it answers 304 while both are
        unchanged. The revision, the items and the count are read in one snapshot. A
        `cursor` that names no position is 422.
      parameters:
        - name: cursor
          in: query
          required: false
          description: The `next` of the previous page, unchanged; omitted for the first page
          schema:
            type: string
        - name: If-None-Match
          in: header
          required: false
          description: The ETag of the first page the client already shows
          schema:
            type: string
            examples: ['"42-3"']
      responses:
        '200':
          description: A page of the queue
          headers:
            ETag:
              description: Data revision and account of the first page; a later page has none
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PendingPage'
        '304':
          description: The first page is unchanged since the one named in `If-None-Match`
          headers:
            ETag:
              description: The same ETag
              schema:
                type: string
        '401':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
  /api/scoreboard:
    parameters:
      - $ref: '#/components/parameters/ClientVersion'
    get:
      operationId: getScoreboard
      summary: Standings in the window `[from, to)`, or of all time with `scope=all`
      description: >-
        Persons with entries in the selection, ranked by score (ties by name). The
        selection is exactly one of: a window, from `from` on and before `to` when it is
        given (without `to` the answer and its ETag are the same as before the window had
        an end), or all time with `scope=all`, every entry ever recorded. An entry belongs
        to the window it was recorded in, whenever it was verified. A missing or invalid
        `from`, an invalid `to`, a `to` not after `from`, a `to` without `from`, another
        `scope` than `all`, or `scope=all` together with `from` or `to` is 422. score =
        Σ quantity × multiplier × points; count = Σ quantity × multiplier; per-drink
        counters likewise. The multiplier is the factor's current one, 1 without a
        factor. Only verified entries count: a recorded entry waits for verification
        by another account, and until then it counts in `recordedCount` and
        `pendingCount` only. A person whose entries in the selection all wait is listed in
        `unranked`. The ETag names the data revision, which every write of entries,
        persons, drinks and factors, every verification and every account deletion bumps
        in its own transaction, and the selection: `If-None-Match` with the
        last ETag of the same selection answers 304 without aggregating while the
        revision is unchanged.
        Each row names the person's photo by `photoUrl`; a photo write that changes it
        bumps the revision too, so the next conditional request gets the new URL.
      parameters:
        - name: from
          in: query
          required: false
          description: >-
            Start of the window (inclusive), such as local midnight of the viewer's day, as
            an ISO-8601 instant with offset; required unless `scope=all`
          schema:
            type: string
            format: date-time
            examples: ['2026-11-14T23:00:00.000Z']
        - $ref: '#/components/parameters/WindowTo'
        - $ref: '#/components/parameters/AllTimeScope'
        - name: If-None-Match
          in: header
          required: false
          description: The ETag of the standings the client already shows
          schema:
            type: string
            examples: ['"42-1763161200000"']
      responses:
        '200':
          description: The standings
          headers:
            ETag:
              description: Data revision and selection of these standings
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Scoreboard'
        '304':
          description: Unchanged since the standings named in `If-None-Match`
          headers:
            ETag:
              description: The same ETag
              schema:
                type: string
        '401':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
  /api/scoreboard/days:
    parameters:
      - $ref: '#/components/parameters/ClientVersion'
    get:
      operationId: getScoreboardDays
      summary: The days with drinks in a window of at most 35 days or of all time, as sessions of quarter hours with a verified entry
      description: >-
        The raw material of the Rangliste's calendar marks (a month's window) and its
        `Gesamt` line (all time): the spans, ascending, of the sessions with at least one
        entry that counts, with exactly the scoreboard's rule: verified entries of persons
        and drinks that still exist; pending entries are left out.
        Each span runs from the start of a session's first 15-minute UTC bucket with a row
        that counts to the end of its last; a pause shorter than 6 hours without such a row
        does not end a session, so an evening is one span. The bucket of a row is decided by
        its recording instant alone, never by its verification, so a row recorded before
        midnight and verified the next day stays in the bucket it was recorded in. Every UTC
        offset in use is a multiple of 15 minutes and every local day is longer than 6 hours,
        so the client finds its local days exactly: a local day has data when a span
        overlaps it (a span over local midnight touches both days); the server knows no time
        zone. The selection is exactly one of: a window `[from, to)` of at most 35 days, the
        calendar's month (a window answers the spans of its own rows, cut at its bounds, and
        seeks them by recording instant), or all time with `scope=all`, the `Gesamt` line. A
        missing or invalid `from` or `to`, a `to` not after `from` or more than 35 days after
        it, another `scope` than `all`, or `scope=all` together with `from` or `to` is 422,
        as for the scoreboard. The size grows with the evenings that have rows, never with
        the rows or their quarter hours: a month is a few hundred bytes, five years of
        evenings a few ten kilobytes. The ETag names the data revision, read in the same
        snapshot as the spans, and the selection; every write, verification and deletion
        bumps the revision, so `If-None-Match` with the last ETag of the same selection
        answers 304 without reading while nothing changed.
      parameters:
        - $ref: '#/components/parameters/DaysFrom'
        - $ref: '#/components/parameters/DaysTo'
        - $ref: '#/components/parameters/AllTimeScope'
        - name: If-None-Match
          in: header
          required: false
          description: The ETag of the spans of the same selection the client already has
          schema:
            type: string
            examples: ['"42-1793487600000-1796079600000"', '"42-all"']
      responses:
        '200':
          description: The sessions with rows that count
          headers:
            ETag:
              description: Data revision and selection of these spans
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DaysWithData'
        '304':
          description: Unchanged since the spans named in `If-None-Match`
          headers:
            ETag:
              description: The same ETag
              schema:
                type: string
        '401':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
  /api/games:
