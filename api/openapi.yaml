  /api/matches/{id}:
    parameters:
      - $ref: '#/components/parameters/ClientVersion'
      - $ref: '#/components/parameters/ClientId'
    put:
      operationId: recordMatch
      summary: Record a match of a duel game, idempotently on its id
      description: >-
        The match is recorded in the game's current run, with the account and the server time
        (UTC). It waits for verification by another account and counts for neither player
        until then (PRD #61); the response is the same either way. A repeated request with the same id and content answers 200 with the original
        match and records nothing, even after the match was deleted or its game deleted; the
        same id with other content, or an id already used for an entry, answers 409
        `request-conflict`. Ids are remembered for seven days. An unknown game is 404; the
        same person twice, an unknown person, an unknown outcome, `draw` while the game's
        `drawsAllowed` is off, or a points game is 422.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewMatch'
      responses:
        '200':
          description: Already recorded by an earlier request with this id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Match'
        '201':
          description: Recorded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Match'
        '401':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '415':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
    delete:
      operationId: deleteMatch
      summary: Delete a match (undo); its id stays known, so a late retry cannot bring it back
      responses:
        '204':
          description: Deleted
        '401':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
  /api/matches/{id}/verification:
    parameters:
      - $ref: '#/components/parameters/ClientVersion'
      - name: id
        in: path
        required: true
        description: The match's UUID; anything that is not a lower-case UUID v4 is 404
        schema:
          type: string
          pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$'
    put:
      operationId: verifyMatch
      summary: Verify a pending match, so that it counts on both sides (four-eyes rule)
      description: >-
        The same rule and answers as `PUT /api/entries/{id}/verification`. A match is
        verified as a whole: it counts for both players at once, and a side cleared by a
        person's deletion stays cleared. Verifying a match of an earlier run leaves the
        current standings unchanged.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
      responses:
        '204':
          description: The match counts
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '415':
          $ref: '#/components/responses/Problem'
    delete:
      operationId: rejectMatch
      summary: Reject a pending match, so that it never counts (four-eyes rule)
      description: >-
        The same rule and answers as `DELETE /api/entries/{id}/verification`: removes the
        match with one `reject` event, 403 `own-row` for the recording account (which undoes
        it through `DELETE /api/matches/{id}` instead), 409 `already-verified` for a match
        that counts already, 404 for one that no longer exists.
      responses:
        '204':
          description: The match is removed
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
  /api/results/{id}:
    parameters:
      - $ref: '#/components/parameters/ClientVersion'
      - $ref: '#/components/parameters/ClientId'
    put:
      operationId: recordResult
      summary: Record one person's points in a points game, idempotently on its id
      description: >-
        The result is recorded in the game's current run, with the account and the server time
        (UTC). It waits for verification by another account and stays out of the standings
        until then (PRD #61); the response is the same either way. Replays and conflicts as
        for matches: a repeated request with the same id and
        content answers 200 with the original result and records nothing, even after the result
        was deleted or its game deleted; the same id with other content, or an id already used
        for an entry or a match, answers 409 `request-conflict`. Ids are remembered for seven
        days. An unknown game is 404; points that are not a whole number from −9 999 to 9 999,
        a missing or unknown person, or a duel game is 422.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewResult'
      responses:
        '200':
          description: Already recorded by an earlier request with this id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Result'
        '201':
          description: Recorded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Result'
        '401':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '415':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
    delete:
      operationId: deleteResult
      summary: Delete a result (undo); its id stays known, so a late retry cannot bring it back
      responses:
        '204':
          description: Deleted
        '401':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
  /api/results/{id}/verification:
    parameters:
      - $ref: '#/components/parameters/ClientVersion'
      - name: id
        in: path
        required: true
        description: The result's UUID; anything that is not a lower-case UUID v4 is 404
        schema:
          type: string
          pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$'
    put:
      operationId: verifyResult
      summary: Verify a pending result, so that it counts in the standings (four-eyes rule)
      description: >-
        The same rule and answers as `PUT /api/entries/{id}/verification`. Verifying a result
        of an earlier run leaves the current standings unchanged.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
      responses:
        '204':
          description: The result counts
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '415':
          $ref: '#/components/responses/Problem'
    delete:
      operationId: rejectResult
      summary: Reject a pending result, so that it never counts (four-eyes rule)
      description: >-
        The same rule and answers as `DELETE /api/entries/{id}/verification`: removes the
        result with one `reject` event, 403 `own-row` for the recording account (which undoes
        it through `DELETE /api/results/{id}` instead), 409 `already-verified` for a result
        that counts already, 404 for one that no longer exists.
      responses:
        '204':
          description: The result is removed
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
  /api/audit:
    parameters:
      - $ref: '#/components/parameters/ClientVersion'
    get:
      operationId: listAuditEvents
      summary: A page of audit events, newest first (admins only)
      description: >-
        The audit log is application-level append-only history: every create, update and
        delete of a person, a drink, a factor or a game (a restart is an update of its `run`
        and `startedAt`), and every entry counted or deleted and every match or result recorded
        or deleted (a game's deletion records one for each of its matches or results, caused by
        it; a person's deletion one for each of their results), and every entry, match or
        result verified by another account (`verify`, with the row before and after) or
        rejected by one (`reject`, with the row before), recorded in the transaction of
        the change with the acting account and the values before and after. A write that fails,
        a replayed entry, match or result request, and an update that changes no
        value record nothing. No route changes or deletes an event (other methods on this
        path answer 405), and reading the log does not change the data revision. Pages run
        newest first by event id: `before` reads only older events, `limit` sets the page size,
        and `next` is the `before` of the next older page. A `before` that is not a positive
        integer, or a `limit` outside 1 to 100, is 422.
      parameters:
        - name: before
          in: query
          required: false
          description: An event id; only older events are returned. Omitted, the page starts at the newest event.
          schema:
            type: integer
            minimum: 1
        - name: limit
          in: query
          required: false
          description: Events per page
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: A page of events, newest first
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditPage'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
components:
  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: session
  parameters:
    ClientVersion:
      name: X-Client-Version
      in: header
      required: false
      description: >-
        The web client's app version (`MAJOR.MINOR.PATCH`, optionally with `+build`).
        Below health's `minClientVersion` the request is refused with 400
        `client-outdated` and nothing is processed; without the header it counts
        as 0.1.0.
      schema:
        type: string
        examples: ['0.3.0+3f2a1bc']
    GameId:
      name: id
      in: path
      required: true
      description: The game's id; anything but a positive integer is 404
      schema:
        type: integer
        minimum: 1
    ClientId:
      name: id
      in: path
      required: true
      description: >-
        The client-generated UUID v4 (lower case) of a match or a result, also its retry key;
        unique across entries, matches and results. Anything else is 404.
      schema:
        type: string
        pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$'
    WindowTo:
      name: to
      in: query
      required: false
      description: >-
        End of the window (exclusive), such as the next local midnight, as an ISO-8601
        instant with offset; after `from`, and only with it. Without it the window has no end.
      schema:
        type: string
        format: date-time
        examples: ['2026-11-15T23:00:00.000Z']
    DaysFrom:
      name: from
      in: query
      required: false
      description: >-
        Start of a days read's window (inclusive), such as local midnight of the first day
        of the calendar's month, as an ISO-8601 instant with offset; required unless
        `scope=all`
      schema:
        type: string
        format: date-time
        examples: ['2026-10-31T23:00:00.000Z']
    DaysTo:
      name: to
      in: query
      required: false
      description: >-
        End of a days read's window (exclusive), such as local midnight of the first day of
        the next month, as an ISO-8601 instant with offset; required with `from`, after it
        and at most 35 days after it (a local month and a margin), and only with it
      schema:
        type: string
        format: date-time
        examples: ['2026-11-30T23:00:00.000Z']
    AllTimeScope:
      name: scope
      in: query
      required: false
      description: >-
        `all` for all time: every row ever recorded, no lower and no upper bound. Not
        together with `from` or `to`.
      schema:
        type: string
        enum: [all]
    HistoryBefore:
      name: before
      in: query
      required: false
      description: The `next` of the previous page, unchanged; omitted for the newest page of the current run
      schema:
        type: string
    HistoryLimit:
      name: limit
      in: query
      required: false
      description: Rows per page
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
  responses:
    Problem:
      description: An error, described as a problem
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    TooManyAttempts:
      description: Five failed sign-ins for this user name and address in 15 minutes
      headers:
        Retry-After:
          description: Seconds until the window of the oldest failure has passed, at most
          schema:
            type: integer
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    Account:
      type: object
      additionalProperties: false
      required: [id, userName, isAdmin]
      properties:
        id:
          type: integer
          minimum: 1
        userName:
          type: string
          minLength: 1
          maxLength: 40
          examples: ['anna']
        isAdmin:
          type: boolean
    AccountList:
      type: object
      additionalProperties: false
      required: [accounts]
      properties:
        accounts:
          type: array
          items:
            $ref: '#/components/schemas/Account'
    SignIn:
      type: object
      required: [userName, password]
      properties:
        userName:
          type: string
        password:
          type: string
    PasswordChange:
      type: object
      required: [currentPassword, newPassword]
      properties:
        currentPassword:
          type: string
        newPassword:
          type: string
          description: At least 10 characters and at most 72 bytes in UTF-8 (bcrypt ignores the rest), no NUL character; otherwise 422 with a field error
          minLength: 10
    NewAccount:
      type: object
      required: [userName, password]
      properties:
        userName:
          type: string
          description: Trimmed; 1–40 characters; unique regardless of case
          maxLength: 40
        password:
          type: string
          description: The start password. At least 10 characters and at most 72 bytes in UTF-8 (bcrypt ignores the rest), no NUL character; otherwise 422 with a field error
          minLength: 10
    AccountChange:
      type: object
      properties:
        isAdmin:
          type: boolean
          description: Grant (true) or revoke (false) admin rights
        password:
          type: string
          description: The new password (a reset); signs the account out everywhere. At least 10 characters and at most 72 bytes in UTF-8 (bcrypt ignores the rest), no NUL character; otherwise 422 with a field error
          minLength: 10
    Name:
      type: string
      description: Trimmed; 1–40 characters; unique regardless of case
      minLength: 1
      maxLength: 40
    PhotoUrl:
      type: [string, 'null']
      description: >-
        The person's photo, null without one. Built by the server as
        `<basePath>/api/persons/{id}/photo?v=<version>`, naming the photo's version, so the
        photo it serves can be cached for good; use it as it is, never compose one.
      examples:
        - '/api/persons/1/photo?v=9f86d081884c7d659a2feaa0c55ad015a3bf4f1b2b0b822cd15d6c15b0f00a08'
    Person:
      type: object
      additionalProperties: false
      required: [id, name, photoUrl]
      properties:
        id:
          type: integer
          minimum: 1
        name:
          $ref: '#/components/schemas/Name'
        photoUrl:
          $ref: '#/components/schemas/PhotoUrl'
    PersonDetail:
      type: object
      additionalProperties: false
      required: [id, name, photoUrl, entryCount, matchCount, resultCount]
      properties:
        id:
          type: integer
          minimum: 1
        name:
          $ref: '#/components/schemas/Name'
        photoUrl:
          $ref: '#/components/schemas/PhotoUrl'
        entryCount:
          type: integer
          minimum: 0
          description: Entries of every day that are the person's; deleting the person deletes them
        matchCount:
          type: integer
          minimum: 0
          description: Matches of every game and run that name the person on either side; deleting the person keeps them with that side cleared
        resultCount:
          type: integer
          minimum: 0
          description: Results of every game and run that are the person's; deleting the person deletes them
    PersonList:
      type: object
      additionalProperties: false
      required: [persons]
      properties:
        persons:
          type: array
          items:
            $ref: '#/components/schemas/Person'
    NewPerson:
      type: object
      required: [name]
      properties:
        name:
          $ref: '#/components/schemas/Name'
    NewPersonPhoto:
      type: object
      required: [image]
      properties:
        image:
          type: string
          maxLength: 87384
          contentEncoding: base64
          contentMediaType: image/jpeg
          description: A 256 × 256 JPEG of at most 64 KiB, as padded base64 without line breaks
    Points:
      type: number
      description: Alcohol base points, 0–9 999.99 with at most two decimals
      minimum: 0
      maximum: 9999.99
      multipleOf: 0.01
    Drink:
      type: object
      additionalProperties: false
      required: [id, name, points]
      properties:
        id:
          type: integer
          minimum: 1
        name:
          $ref: '#/components/schemas/Name'
        points:
          $ref: '#/components/schemas/Points'
    DrinkDetail:
      type: object
      additionalProperties: false
      required: [id, name, points, entryCount]
      properties:
        id:
          type: integer
          minimum: 1
        name:
          $ref: '#/components/schemas/Name'
        points:
          $ref: '#/components/schemas/Points'
        entryCount:
          type: integer
          minimum: 0
          description: Entries of every day that are of the drink
    DrinkList:
      type: object
      additionalProperties: false
      required: [drinks]
      properties:
        drinks:
          type: array
          items:
            $ref: '#/components/schemas/Drink'
    NewDrink:
      type: object
      required: [name, points]
      properties:
        name:
          $ref: '#/components/schemas/Name'
        points:
          $ref: '#/components/schemas/Points'
    Multiplier:
      type: number
      description: Above 0 up to 99.99 with at most two decimals
      exclusiveMinimum: 0
      maximum: 99.99
      multipleOf: 0.01
    Factor:
      type: object
      additionalProperties: false
      required: [id, name, multiplier]
      properties:
        id:
          type: integer
          minimum: 1
        name:
          $ref: '#/components/schemas/Name'
        multiplier:
          $ref: '#/components/schemas/Multiplier'
    FactorDetail:
      type: object
      additionalProperties: false
      required: [id, name, multiplier, entryCount]
      properties:
        id:
          type: integer
          minimum: 1
        name:
          $ref: '#/components/schemas/Name'
        multiplier:
          $ref: '#/components/schemas/Multiplier'
        entryCount:
          type: integer
          minimum: 0
          description: Entries of every day that use the factor
    FactorList:
      type: object
      additionalProperties: false
      required: [factors]
      properties:
        factors:
          type: array
          items:
            $ref: '#/components/schemas/Factor'
    NewFactor:
      type: object
      required: [name, multiplier]
      properties:
        name:
          $ref: '#/components/schemas/Name'
        multiplier:
          $ref: '#/components/schemas/Multiplier'
    Quantity:
      type: integer
      minimum: 1
      maximum: 99
    NewEntry:
      type: object
      required: [personId, drinkId, quantity]
      properties:
        personId:
          type: integer
        drinkId:
          type: integer
        quantity:
          $ref: '#/components/schemas/Quantity'
        factorId:
          type: [integer, 'null']
          description: The chosen factor; missing or null for no factor (counts ×1)
    Entry:
      type: object
      additionalProperties: false
      required: [id, personId, drinkId, quantity, factorId, createdAt]
      properties:
        id:
          type: string
        personId:
          type: integer
        drinkId:
          type: integer
        quantity:
          $ref: '#/components/schemas/Quantity'
        factorId:
          type: [integer, 'null']
          description: The factor of the request; null for none
        createdAt:
          type: string
          format: date-time
          description: Server time of the first request, UTC
          examples: ['2026-11-14T22:41:07.123Z']
    EntryHistory:
      type: object
      additionalProperties: false
      required: [entries]
      properties:
        entries:
          type: array
          description: Newest first
          items:
            $ref: '#/components/schemas/HistoryEntry'
    HistoryEntry:
      type: object
      additionalProperties: false
      required: [id, drink, quantity, factor, createdAt, accountName, pending]
      properties:
        id:
          type: string
        drink:
          type: object
          additionalProperties: false
          required: [id, name]
          properties:
            id:
              type: integer
            name:
              type: string
        quantity:
          $ref: '#/components/schemas/Quantity'
        factor:
          oneOf:
            - type: 'null'
            - type: object
              additionalProperties: false
              required: [id, name, multiplier]
              properties:
                id:
                  type: integer
                name:
                  type: string
                multiplier:
                  type: number
          description: The factor with its current multiplier; null for none or a deleted factor
        createdAt:
          type: string
          format: date-time
          description: Server time of the entry, UTC
          examples: ['2026-11-14T22:41:07.123Z']
        accountName:
          type: [string, 'null']
          description: User name of the account that logged it; null once that account was deleted
        pending:
          type: boolean
          description: Whether the entry still waits for verification by another account; a pending entry does not count
    PendingPage:
      type: object
      additionalProperties: false
      required: [items, next, count]
      properties:
        items:
          type: array
          description: Newest first by recording instant, then by kind, then by id
          items:
            $ref: '#/components/schemas/PendingItem'
        next:
          type: [string, 'null']
          description: The `cursor` of the next page; null on the last page
        count:
          type: integer
          minimum: 0
          description: How many rows the account may verify in all, whatever the page
    PendingItem:
      description: A row the account may verify, tagged with its kind
      oneOf:
        - $ref: '#/components/schemas/PendingEntry'
        - $ref: '#/components/schemas/PendingMatch'
        - $ref: '#/components/schemas/PendingResult'
      discriminator:
        propertyName: kind
        mapping:
          entry: '#/components/schemas/PendingEntry'
          match: '#/components/schemas/PendingMatch'
          result: '#/components/schemas/PendingResult'
    PendingEntry:
      type: object
      additionalProperties: false
      required:
        [kind, id, createdAt, accountName, person, drink, quantity, factor]
      properties:
        kind:
          type: string
          const: entry
        id:
          type: string
        createdAt:
          type: string
          format: date-time
          description: Server time of the recording, UTC
          examples: ['2026-11-14T22:41:07.123Z']
        accountName:
          type: [string, 'null']
          description: User name of the account that recorded it; null once that account was deleted
        person:
          type: object
          additionalProperties: false
          required: [id, name]
          properties:
            id:
              type: integer
            name:
              type: string
        drink:
          type: object
          additionalProperties: false
          required: [id, name]
          properties:
            id:
              type: integer
            name:
              type: string
        quantity:
          $ref: '#/components/schemas/Quantity'
        factor:
          oneOf:
            - type: 'null'
            - type: object
              additionalProperties: false
              required: [id, name, multiplier]
              properties:
                id:
                  type: integer
                name:
                  type: string
                multiplier:
                  type: number
          description: The factor with its current multiplier; null for none or a deleted factor
    PendingMatch:
      type: object
      additionalProperties: false
      required:
        [
          kind,
          id,
          createdAt,
          accountName,
          game,
          earlierRun,
          first,
          second,
          outcome,
        ]
      properties:
        kind:
          type: string
          const: match
        id:
          type: string
        createdAt:
          type: string
          format: date-time
          description: Server time of the recording, UTC
          examples: ['2026-11-14T22:41:07.123Z']
        accountName:
          type: [string, 'null']
          description: User name of the account that recorded it; null once that account was deleted
        game:
          type: object
          additionalProperties: false
          required: [id, name]
          properties:
            id:
              type: integer
            name:
              type: string
        earlierRun:
          type: boolean
          description: >-
            The match belongs to an earlier run of its game (recorded before a restart);
            verifying it leaves the current standings unchanged
        first:
          description: Null once that person was deleted (`gelöschte Person`)
          oneOf:
            - $ref: '#/components/schemas/PersonRef'
            - type: 'null'
        second:
          description: Null once that person was deleted (`gelöschte Person`)
          oneOf:
            - $ref: '#/components/schemas/PersonRef'
            - type: 'null'
        outcome:
          $ref: '#/components/schemas/Outcome'
    PendingResult:
      type: object
      additionalProperties: false
      required:
        [kind, id, createdAt, accountName, game, earlierRun, person, points]
      properties:
        kind:
          type: string
          const: result
        id:
          type: string
        createdAt:
          type: string
          format: date-time
          description: Server time of the recording, UTC
          examples: ['2026-11-14T22:41:07.123Z']
        accountName:
          type: [string, 'null']
          description: User name of the account that recorded it; null once that account was deleted
        game:
          type: object
          additionalProperties: false
          required: [id, name]
          properties:
            id:
              type: integer
            name:
              type: string
        earlierRun:
          type: boolean
          description: >-
            The result belongs to an earlier run of its game (recorded before a restart);
            verifying it leaves the current standings unchanged
        person:
          $ref: '#/components/schemas/PersonRef'
        points:
          $ref: '#/components/schemas/GamePoints'
    Scoreboard:
      type: object
      additionalProperties: false
      required: [rows, unranked]
      properties:
        rows:
          type: array
          description: >-
            Persons with at least one verified entry in the selection, ranked by score, ties by
            name; persons without entries are absent
          items:
            $ref: '#/components/schemas/ScoreRow'
        unranked:
          type: array
          description: >-
            Persons whose entries in the selection all wait for verification, by name: they have
            no rank and never lead
          items:
            $ref: '#/components/schemas/UnrankedRow'
    ScoreRow:
      type: object
      additionalProperties: false
      required:
        [personId, name, photoUrl, score, count, rawCount, pendingCount, drinks]
      properties:
        personId:
          type: integer
        name:
          type: string
        photoUrl:
          $ref: '#/components/schemas/PhotoUrl'
        score:
          type: number
          description: Verified entries only
        count:
          type: number
          description: Verified entries only
        rawCount:
          type: number
          description: >-
            Σ quantity over the verified entries, without their factors; the sum of the drinks'
            `rawCount`
        pendingCount:
          type: integer
          minimum: 0
          description: The number of the person's entries in the selection that wait for verification (rows, not quantities)
        drinks:
          type: array
          description: By drink name; only drinks with entries, pending ones included
          items:
            $ref: '#/components/schemas/DrinkCount'
    UnrankedRow:
      type: object
      additionalProperties: false
      required: [personId, name, photoUrl, pendingCount, drinks]
      properties:
        personId:
          type: integer
        name:
          type: string
        photoUrl:
          $ref: '#/components/schemas/PhotoUrl'
        pendingCount:
          type: integer
          minimum: 1
          description: The number of the person's entries in the selection, all waiting for verification
        drinks:
          type: array
          description: By drink name; each `count` and `rawCount` is 0
          items:
            $ref: '#/components/schemas/DrinkCount'
    DrinkCount:
      type: object
      additionalProperties: false
      required:
        [drinkId, name, count, recordedCount, rawCount, rawRecordedCount]
      properties:
        drinkId:
          type: integer
        name:
          type: string
        count:
          type: number
          description: Σ quantity × multiplier over the verified entries, which rank
        recordedCount:
          type: number
          description: >-
            Σ quantity × multiplier over every recorded entry, pending ones included: what
            the recording flow shows
        rawCount:
          type: number
          description: Σ quantity over the verified entries, without their factors
        rawRecordedCount:
          type: number
          description: Σ quantity over every recorded entry, pending ones included, without their factors
    DaysWithData:
      type: object
      additionalProperties: false
      required: [spans]
      properties:
        spans:
          type: array
          description: >-
            The sessions with at least one row that counts in the selection, ascending and
            disjoint, each from the start of its first 15-minute UTC bucket to the end of its
            last; empty when nothing counts there
          items:
            $ref: '#/components/schemas/Span'
    Span:
      type: object
      additionalProperties: false
      required: [from, to]
      properties:
        from:
          type: string
          format: date-time
          description: Start (inclusive), the start of a 15-minute UTC bucket
          examples: ['2026-11-14T19:00:00.000Z']
        to:
          type: string
          format: date-time
          description: End (exclusive), the end of a 15-minute UTC bucket
          examples: ['2026-11-14T23:15:00.000Z']
    GameKind:
      type: string
      enum: [duel, points]
      description: '`duel`: two persons and an outcome. `points`: one person and a whole number.'
    Game:
      type: object
      additionalProperties: false
      required: [id, name, kind, drawsAllowed, lowerWins, startedAt]
      properties:
        id:
          type: integer
          minimum: 1
        name:
          $ref: '#/components/schemas/Name'
        kind:
          $ref: '#/components/schemas/GameKind'
        drawsAllowed:
          type: boolean
          description: Duel games only (points games always say true); whether `draw` can be recorded
        lowerWins:
          type: boolean
          description: Points games only (duel games always say false); whether the lowest sum ranks first
        startedAt:
          type: string
          format: date-time
          description: When the current run began (creation or last restart), UTC; for display (`seit …`)
    GameDetail:
      type: object
      additionalProperties: false
      required:
        [
          id,
          name,
          kind,
          drawsAllowed,
          lowerWins,
          startedAt,
          matchCount,
          resultCount,
        ]
      properties:
        id:
          type: integer
          minimum: 1
        name:
          $ref: '#/components/schemas/Name'
        kind:
          $ref: '#/components/schemas/GameKind'
        drawsAllowed:
          type: boolean
        lowerWins:
          type: boolean
        startedAt:
          type: string
          format: date-time
        matchCount:
          type: integer
          minimum: 0
          description: Every stored match of the game, of every run; 0 for a points game
        resultCount:
          type: integer
          minimum: 0
          description: Every stored result of the game, of every run; 0 for a duel game
    GameList:
      type: object
      additionalProperties: false
      required: [games]
      properties:
        games:
          type: array
          items:
            $ref: '#/components/schemas/Game'
    NewGame:
      type: object
      required: [name, kind]
      properties:
        name:
          $ref: '#/components/schemas/Name'
        kind:
          $ref: '#/components/schemas/GameKind'
        drawsAllowed:
          type: boolean
          description: Duel games; default true
        lowerWins:
          type: boolean
          description: Points games; default false
    GameChange:
      type: object
      required: [name]
      properties:
        name:
          $ref: '#/components/schemas/Name'
        kind:
          $ref: '#/components/schemas/GameKind'
          description: Optional; only the game's own kind is accepted
        drawsAllowed:
          type: boolean
          description: Duel games; omitted, it stays
        lowerWins:
          type: boolean
          description: Points games; omitted, it stays
    Outcome:
      type: string
      enum: [first, second, draw]
      description: How a match ended, from the first person's side
    NewMatch:
      type: object
      required: [gameId, firstPersonId, secondPersonId, outcome]
      properties:
        gameId:
          type: integer
        firstPersonId:
          type: integer
        secondPersonId:
          type: integer
          description: Another person than `firstPersonId`
        outcome:
          $ref: '#/components/schemas/Outcome'
    Match:
      type: object
      additionalProperties: false
      required: [id, gameId, firstPersonId, secondPersonId, outcome, createdAt]
      properties:
        id:
          type: string
        gameId:
          type: integer
        firstPersonId:
          type: integer
        secondPersonId:
          type: integer
        outcome:
          $ref: '#/components/schemas/Outcome'
        createdAt:
          type: string
          format: date-time
          description: Server time of the first request, UTC
          examples: ['2026-11-14T22:41:07.123Z']
    GamePoints:
      type: integer
      minimum: -9999
      maximum: 9999
      description: One result's points, a whole number
    NewResult:
      type: object
      required: [gameId, personId, points]
      properties:
        gameId:
          type: integer
        personId:
          type: integer
        points:
          $ref: '#/components/schemas/GamePoints'
    Result:
      type: object
      additionalProperties: false
      required: [id, gameId, personId, points, createdAt]
      properties:
        id:
          type: string
        gameId:
          type: integer
        personId:
          type: integer
        points:
          $ref: '#/components/schemas/GamePoints'
        createdAt:
          type: string
          format: date-time
          description: Server time of the first request, UTC
          examples: ['2026-11-14T22:41:07.123Z']
    PersonRef:
      type: object
      additionalProperties: false
      required: [id, name]
      properties:
        id:
          type: integer
        name:
          type: string
    MatchItem:
      type: object
      additionalProperties: false
      required: [id, first, second, outcome, createdAt, accountName, pending]
      properties:
        id:
          type: string
        first:
          description: Null once that person was deleted (`gelöschte Person`)
          oneOf:
            - $ref: '#/components/schemas/PersonRef'
            - type: 'null'
        second:
          description: Null once that person was deleted (`gelöschte Person`)
          oneOf:
            - $ref: '#/components/schemas/PersonRef'
            - type: 'null'
        outcome:
          $ref: '#/components/schemas/Outcome'
        createdAt:
          type: string
          format: date-time
          examples: ['2026-11-14T22:41:07.123Z']
        accountName:
          type: [string, 'null']
          description: The account that recorded the match; null once it was deleted
        pending:
          type: boolean
          description: The match waits for verification (`offen`) and counts for neither player
    MatchPage:
      type: object
      additionalProperties: false
      required: [items, next]
      properties:
        items:
          type: array
          description: Newest first
          items:
            $ref: '#/components/schemas/MatchItem'
        next:
          type: [string, 'null']
          description: >-
            The `before` of the next older page in the same run; null on the last page, so a
            last page that is exactly full is not followed by an empty one
    ResultItem:
      type: object
      additionalProperties: false
      required: [id, person, points, createdAt, accountName, pending]
      properties:
        id:
          type: string
        person:
          $ref: '#/components/schemas/PersonRef'
        points:
          $ref: '#/components/schemas/GamePoints'
        createdAt:
          type: string
          format: date-time
          examples: ['2026-11-14T22:41:07.123Z']
        accountName:
          type: [string, 'null']
          description: The account that recorded the result; null once it was deleted
        pending:
          type: boolean
          description: The result waits for verification (`offen`) and is not in the standings
    ResultPage:
      type: object
      additionalProperties: false
      required: [items, next]
      properties:
        items:
          type: array
          description: Newest first
          items:
            $ref: '#/components/schemas/ResultItem'
        next:
          type: [string, 'null']
          description: >-
            The `before` of the next older page in the same run; null on the last page, so a
            last page that is exactly full is not followed by an empty one
    Standings:
      oneOf:
        - $ref: '#/components/schemas/DuelStandings'
        - $ref: '#/components/schemas/PointsStandings'
      discriminator:
        propertyName: kind
        mapping:
          duel: '#/components/schemas/DuelStandings'
          points: '#/components/schemas/PointsStandings'
    DuelStandings:
      type: object
      additionalProperties: false
      required: [kind, startedAt, rows, unranked]
      properties:
        kind:
          type: string
          const: duel
        startedAt:
          type: string
          format: date-time
          description: When the current run began, UTC, whatever the selection
        rows:
          type: array
          description: >-
            Persons with at least one verified match in the selection, ranked by points, then
            wins, then name; only verified matches count. Persons without a match in the
            selection are absent
          items:
            $ref: '#/components/schemas/DuelRow'
        unranked:
          type: array
          description: >-
            Persons whose matches in the selection all wait for verification, by name: they
            have no rank and never lead
          items:
            $ref: '#/components/schemas/UnrankedPlayer'
    UnrankedPlayer:
      type: object
      additionalProperties: false
      required: [personId, name, pendingCount]
      properties:
        personId:
          type: integer
        name:
          type: string
        pendingCount:
          type: integer
          minimum: 1
          description: The person's pending rows in the selection (`+n offen`)
    DuelRow:
      type: object
      additionalProperties: false
      required:
        [personId, name, points, wins, draws, losses, played, pendingCount]
      properties:
        personId:
          type: integer
        name:
          type: string
        points:
          type: number
          description: Win 1, draw 0.5, loss 0
        wins:
          type: integer
        draws:
          type: integer
        losses:
          type: integer
        played:
          type: integer
          description: Verified matches; `wins`, `draws` and `losses` count verified ones too
        pendingCount:
          type: integer
          minimum: 0
          description: >-
            The person's matches in the selection that wait for verification (`+n offen`); a pending
            match counts once for each player that still exists
    PointsStandings:
      type: object
      additionalProperties: false
      required: [kind, startedAt, lowerWins, rows, unranked]
      properties:
        kind:
          type: string
          const: points
        startedAt:
          type: string
          format: date-time
          description: When the current run began, UTC, whatever the selection
        lowerWins:
          type: boolean
        rows:
          type: array
          description: >-
            Persons with at least one verified result in the selection, ranked by the measure
            (the sum in the current run) in the game's direction, then name, then id; only
            verified results count. Persons without a result in the selection are absent
          items:
            $ref: '#/components/schemas/PointsRow'
        unranked:
          type: array
          description: >-
            Persons whose results in the selection all wait for verification, by name: they have no
            rank and never lead, whichever way the game ranks and whatever the others' sums
          items:
            $ref: '#/components/schemas/UnrankedPlayer'
    PointsRow:
      type: object
      additionalProperties: false
      required: [personId, name, sum, results, pendingCount]
      properties:
        personId:
          type: integer
        name:
          type: string
        sum:
          type: integer
          description: The sum of the person's verified points in the selection
        average:
          type: number
          description: >-
            The sum divided by `results`, rounded half away from zero to one decimal (`3.25` →
            `3.3`, whole numbers without a fraction), for display only: the exact value ranks.
            Sent for a window or all time, whichever the measure; absent in the current run,
            whose rows are as before
        results:
          type: integer
          description: How many verified results make up the sum; the average's denominator
        pendingCount:
          type: integer
          minimum: 0
          description: The person's results in the selection that wait for verification (`+n offen`)
    AuditPage:
      type: object
      additionalProperties: false
      required: [events, next]
      properties:
        events:
          type: array
          description: Newest first, by id
          items:
            $ref: '#/components/schemas/AuditEvent'
        next:
          type: [integer, 'null']
          minimum: 1
          description: >-
            The `before` of the next older page; null when no older event exists, so a last page
            that is exactly full is not followed by an empty one
    AuditEvent:
      type: object
      additionalProperties: false
      required:
        [
          id,
          occurredAt,
          operation,
          subjectKind,
          subjectId,
          actor,
          before,
          after,
          cause,
        ]
      properties:
        id:
          type: integer
          minimum: 1
          description: Sequential; a later event has a larger id
        occurredAt:
          type: string
          format: date-time
          description: Server time of the change, UTC
          examples: ['2026-11-14T22:41:07.123Z']
        operation:
          type: string
          enum: [create, update, delete, verify, reject]
          description: >-
            `verify`: another account let a pending row count; `before` and `after` are the
            row with `pending` true and false. `reject`: another account removed a pending
            row; `before` is the row with `pending` true, `after` is null. A row removed
            through its delete route is always `delete`
        subjectKind:
          type: string
          enum: [entry, person, drink, factor, game, match, result]
        subjectId:
          type: string
          description: The subject's id as text (an integer for persons, drinks, factors and games, the UUID for entries, matches and results)
        actor:
          type: object
          additionalProperties: false
          required: [accountId, userName]
          description: The account that made the change, as it was then; kept after the account is renamed or deleted
          properties:
            accountId:
              type: integer
            userName:
              type: string
        before:
          description: The subject's values before the change; null for a create
          oneOf:
            - type: 'null'
            - $ref: '#/components/schemas/AuditSnapshot'
        after:
          description: The subject's values after the change; null for a delete
          oneOf:
            - type: 'null'
            - $ref: '#/components/schemas/AuditSnapshot'
        cause:
          description: >-
            The event whose change caused this one, null for a direct change. An entry removed
            or changed by the deletion of its person, drink or factor names that deletion here,
            so it can be shown when the deletion's own event is on another page.
          oneOf:
            - type: 'null'
            - type: object
              additionalProperties: false
              required: [id, subjectKind, name]
              properties:
                id:
                  type: integer
                  description: The causing event's id
                subjectKind:
                  type: string
                  enum: [entry, person, drink, factor, game, match, result]
                name:
                  type: string
                  description: The causing event's subject name, as that event recorded it
    AuditSnapshot:
      type: object
      description: >-
        The subject's values as they were, with referenced names resolved then: a person
        `{name, photo}` with the photo's version or null (events recorded before photos
        existed have only `name`), a drink `{name, points}`, a factor `{name, multiplier}`, an entry
        `{person, drink, points, quantity, factor}` with the person's and the drink's names,
        the drink's points, the factor `{name, multiplier}` or null, and `pending` (whether it
        waited for verification; events recorded before the four-eyes rule have none), a game
        `{name, kind, drawsAllowed, run, startedAt}` for a duel game and
        `{name, kind, lowerWins, run, startedAt}` for a points game, a match
        `{game, first, second, outcome, pending}` with the game's and both persons' names (a
        person deleted before is null) and whether it waited for verification (events
        recorded before the four-eyes rule have none), a result `{game, person, points, pending}`
        with the game's and the person's names and whether it waited for verification (events
        recorded before the four-eyes rule have none). Keys are only ever
        added, never renamed, removed or given a new meaning; a reader treats a key it does
        not know, or a missing one, as unknown.
      additionalProperties: true
      properties:
        name:
          type: string
        photo:
          type: [string, 'null']
          description: A person's photo version (lowercase hex SHA-256), null without a photo
        points:
          type: number
        multiplier:
          type: number
        person:
          type: string
        drink:
          type: string
        quantity:
          type: integer
        kind:
          type: string
        drawsAllowed:
          type: boolean
        lowerWins:
          type: boolean
        run:
          type: integer
        startedAt:
          type: string
          format: date-time
        game:
          type: string
        first:
          type: [string, 'null']
        second:
          type: [string, 'null']
        outcome:
          $ref: '#/components/schemas/Outcome'
        pending:
          type: boolean
          description: Whether the row waited for verification at the time of the event
        factor:
          oneOf:
            - type: 'null'
            - type: object
              description: >-
                The factor's values, under the same rule as the snapshot: keys are only ever
                added, and a missing one is unknown.
              additionalProperties: true
              properties:
                name:
                  type: string
                multiplier:
                  type: number
    Health:
      type: object
      additionalProperties: false
      required:
        - appVersion
        - phpVersion
        - database
        - schemaVersion
        - migration
        - minClientVersion
      properties:
        appVersion:
          type: string
          description: Version of the release that answered, `MAJOR.MINOR.PATCH` with optional build metadata
          examples: ['0.1.0+3f2a1bc']
        phpVersion:
          type: string
          examples: ['8.5.12']
        database:
          type: object
          additionalProperties: false
          required: [engine, version]
          properties:
            engine:
              type: string
              enum: [MySQL, MariaDB]
            version:
              type: string
              examples: ['11.8.8']
        schemaVersion:
          type: integer
          minimum: 0
          description: Number of the newest migration up to which every migration is completed
        migration:
          $ref: '#/components/schemas/MigrationState'
        minClientVersion:
          type: string
          description: The oldest web client version the API still serves; older clients must reload
          examples: ['0.1.0']
    MigrationState:
      type: string
      enum: [ok, running, failed]
    Problem:
      type: object
      required: [type, title, status]
      properties:
        type:
          type: string
          format: uri
          enum:
            - urn:performance:problem:bad-request
            - urn:performance:problem:client-outdated
            - urn:performance:problem:unauthenticated
            - urn:performance:problem:invalid-credentials
            - urn:performance:problem:forbidden
            - urn:performance:problem:own-row
            - urn:performance:problem:already-verified
            - urn:performance:problem:duplicate-user-name
            - urn:performance:problem:duplicate-name
            - urn:performance:problem:last-admin
            - urn:performance:problem:entry-conflict
            - urn:performance:problem:request-conflict
            - urn:performance:problem:unsupported-media-type
            - urn:performance:problem:content-too-large
            - urn:performance:problem:validation
            - urn:performance:problem:too-many-attempts
            - urn:performance:problem:not-found
            - urn:performance:problem:method-not-allowed
            - urn:performance:problem:internal
            - urn:performance:problem:maintenance
            - urn:performance:problem:migration-failed
        title:
          type: string
          description: German, shown to the user as is
        status:
          type: integer
        errors:
          type: object
          description: Field validation errors, keyed by field name
          additionalProperties:
            type: string
