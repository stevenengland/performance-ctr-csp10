openapi: 3.1.0
info:
  title: Performance API
  version: 0.1.0
  description: >-
    JSON API of the Performance drink counter. Fields are camelCase, timestamps
    ISO-8601 UTC, decimals JSON numbers rounded to two places. Every error is
    `application/problem+json` (RFC 9457) with a stable `urn:performance:problem:*`
    type. While a migration runs, every route except health answers 503 with
    `Retry-After`; after a failed migration it answers 503 without it.

    Every route except health and sign-in requires the session cookie that
    sign-in sets (`HttpOnly; Secure; SameSite=Strict`, 180 days, renewed on
    use at most once a day: only then does a response set the cookie again) and
    answers 401 without a valid one. Request bodies must be
    `application/json` (415 otherwise).
servers:
  - url: /
security:
  - session: []
paths:
  /api/health:
    get:
      operationId: getHealth
      summary: Versions, schema and migration state; brings the schema up to date first
      security: []
      responses:
        '200':
          description: The installation's health
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
        '500':
          $ref: '#/components/responses/Problem'
  /api/session:
    post:
      operationId: signIn
      summary: Sign in; creates the bootstrap admin first when no admin exists
      description: >-
        Sets the session cookie. After five failed sign-ins for the same user name
        and client address within 15 minutes, answers 429 until the window passes.
        An unknown user name and a wrong password get the same answer.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignIn'
      responses:
        '200':
          description: Signed in
          headers:
            Set-Cookie:
              description: '`session=<token>; Path=/; Max-Age=15552000; HttpOnly; Secure; SameSite=Strict`'
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '415':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/TooManyAttempts'
    get:
      operationId: getSession
      summary: The signed-in account
      responses:
        '200':
          description: The signed-in account
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
        '401':
          $ref: '#/components/responses/Problem'
    delete:
      operationId: signOut
      summary: Sign out; revokes the session on the server and clears the cookie
      responses:
        '204':
          description: Signed out
        '401':
          $ref: '#/components/responses/Problem'
  /api/session/password:
    put:
      operationId: changePassword
      summary: Change the own password; signs the account out on every other device
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordChange'
      responses:
        '204':
          description: Changed
        '401':
          $ref: '#/components/responses/Problem'
        '415':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
  /api/accounts:
    get:
      operationId: listAccounts
      summary: Every account, by user name (admins only)
      responses:
        '200':
          description: The accounts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountList'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
    post:
      operationId: createAccount
      summary: Create an account (admins only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewAccount'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '415':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
  /api/accounts/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: The account's id; anything but a positive integer is 404
        schema:
          type: integer
          minimum: 1
    patch:
      operationId: updateAccount
      summary: Grant or revoke admin rights, or reset the password (admins only)
      description: >-
        Only the given fields change. A password reset signs the account out on every
        device. Demoting the last admin is refused with 409 and changes nothing;
        concurrent demotions and deletions are serialised by the database.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountChange'
      responses:
        '200':
          description: Changed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '415':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
    delete:
      operationId: deleteAccount
      summary: Delete an account (admins only)
      description: >-
        Its sessions end; the entries it logged stay, without the account
        (`accountName` null). Deleting the last admin is refused with 409.
      responses:
        '204':
          description: Deleted
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
  /api/persons:
    get:
      operationId: listPersons
      summary: Every person, alphabetical (ignoring case)
      responses:
        '200':
          description: The persons
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PersonList'
        '401':
          $ref: '#/components/responses/Problem'
    post:
      operationId: createPerson
      summary: Create a person
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewPerson'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Person'
        '401':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '415':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
  /api/persons/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: The person's id; anything but a positive integer is 404
        schema:
          type: integer
          minimum: 1
    get:
      operationId: getPerson
      summary: A person with the number of their entries and matches (for the delete dialog)
      responses:
        '200':
          description: The person
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PersonDetail'
        '401':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
    patch:
      operationId: updatePerson
      summary: Rename a person
      description: >-
        Validated like creating. Scores and lists show the new name from then on.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewPerson'
      responses:
        '200':
          description: Changed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Person'
        '401':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '415':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
    delete:
      operationId: deletePerson
      summary: Delete a person and all of their entries; their matches stay with that side cleared
      description: >-
        Every match that names the person keeps its row and outcome with the person's side cleared,
        so the opponent's win, draw or loss still counts; the audit log records one update per such
        match, caused by the person's deletion.
      responses:
        '204':
          description: Deleted
        '401':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
  /api/drinks:
    get:
      operationId: listDrinks
      summary: Every drink, alphabetical (ignoring case)
      responses:
        '200':
          description: The drinks
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DrinkList'
        '401':
          $ref: '#/components/responses/Problem'
    post:
      operationId: createDrink
      summary: Create a drink with its alcohol base points
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewDrink'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Drink'
        '401':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '415':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
  /api/drinks/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: The drink's id; anything but a positive integer is 404
        schema:
          type: integer
          minimum: 1
    get:
      operationId: getDrink
      summary: A drink with the number of its entries (for the delete dialog)
      responses:
        '200':
          description: The drink
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DrinkDetail'
        '401':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
    patch:
      operationId: updateDrink
      summary: Change a drink's name and points
      description: >-
        Both fields are required. Scores always use the current points, so the change applies to every entry of the drink.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewDrink'
      responses:
        '200':
          description: Changed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Drink'
        '401':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '415':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
    delete:
      operationId: deleteDrink
      summary: Delete a drink and all of its entries
      responses:
        '204':
          description: Deleted
        '401':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
  /api/factors:
    get:
      operationId: listFactors
      summary: Every factor, alphabetical (ignoring case)
      responses:
        '200':
          description: The factors
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FactorList'
        '401':
          $ref: '#/components/responses/Problem'
    post:
      operationId: createFactor
      summary: Create a factor with its multiplier
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewFactor'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Factor'
        '401':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '415':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
  /api/factors/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: The factor's id; anything but a positive integer is 404
        schema:
          type: integer
          minimum: 1
    get:
      operationId: getFactor
      summary: A factor with the number of entries that use it (for the delete dialog)
      responses:
        '200':
          description: The factor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FactorDetail'
        '401':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
    patch:
      operationId: updateFactor
      summary: Change a factor's name and multiplier
      description: >-
        Both fields are required. Scores always use the current multiplier, so the
        change applies to every entry that uses the factor.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewFactor'
      responses:
        '200':
          description: Changed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Factor'
        '401':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '415':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
    delete:
      operationId: deleteFactor
      summary: Delete a factor; its entries stay and count ×1 from then on
      responses:
        '204':
          description: Deleted
        '401':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
  /api/entries:
    get:
      operationId: listEntries
      summary: A person's entries since `from`, the start of the viewer's day, newest first
      description: >-
        Each entry names its drink and its factor (null without one, or once the factor
        was deleted) with their current names, and the user name of the account that
        logged it (null once that account was deleted). A `personId` that is not a positive
        integer is 422; a person that does not exist is 404.
      parameters:
        - name: personId
          in: query
          required: true
          schema:
            type: integer
            minimum: 1
        - name: from
          in: query
          required: true
          description: Local midnight of the viewer's day as an ISO-8601 instant with offset
          schema:
            type: string
            format: date-time
            examples: ['2026-11-14T23:00:00.000Z']
      responses:
        '200':
          description: The entries, newest first
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EntryHistory'
        '401':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
  /api/entries/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: The entry's client-generated UUID v4 (lower case), also the retry key
        schema:
          type: string
          pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$'
    put:
      operationId: addEntry
      summary: Add an entry, idempotently on its id
      description: >-
        The account and the server time (UTC) are recorded with the entry. A repeated
        request with the same id and content (factor included) answers 200 with the
        original entry and creates nothing, even after the entry was deleted; the same
        id with different content answers 409. An unknown factor is 422. Ids are remembered for seven days. Any other id that is not
        a lower-case UUID v4 is 404.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewEntry'
      responses:
        '200':
          description: Already added by an earlier request with this id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Entry'
        '201':
          description: Added
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Entry'
        '401':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '415':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
    delete:
      operationId: deleteEntry
      summary: Delete an entry (undo); its id stays known, so a late retry cannot bring it back
      responses:
        '204':
          description: Deleted
        '401':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
  /api/scoreboard:
    get:
      operationId: getScoreboard
      summary: Standings since `from`, the start of the viewer's day
      description: >-
        Persons with entries since `from`, ranked by score (ties by name). score =
        Σ quantity × multiplier × points; count = Σ quantity × multiplier; per-drink
        counters likewise. The multiplier is the factor's current one, 1 without a
        factor. The ETag names the data revision, which every write of entries,
        persons, drinks and factors bumps in its own transaction, and the window: `If-None-Match` with the
        last ETag answers 304 without aggregating while the revision is unchanged.
      parameters:
        - name: from
          in: query
          required: true
          description: Local midnight of the viewer's day as an ISO-8601 instant with offset
          schema:
            type: string
            format: date-time
            examples: ['2026-11-14T23:00:00.000Z']
        - name: If-None-Match
          in: header
          required: false
          description: The ETag of the standings the client already shows
          schema:
            type: string
            examples: ['"42-1763161200000"']
      responses:
        '200':
          description: The standings
          headers:
            ETag:
              description: Data revision and window of these standings
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Scoreboard'
        '304':
          description: Unchanged since the standings named in `If-None-Match`
          headers:
            ETag:
              description: The same ETag
              schema:
                type: string
        '401':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
  /api/games:
    get:
      operationId: listGames
      summary: Every game, alphabetical (ignoring case)
      responses:
        '200':
          description: The games
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GameList'
        '401':
          $ref: '#/components/responses/Problem'
    post:
      operationId: createGame
      summary: Create a game of a kind; its ranking counts from now
      description: >-
        The game starts in its first run, `startedAt` now. Only the kind's own setting is
        taken (`drawsAllowed` for a duel game, `lowerWins` for a points game); the other one
        is ignored and keeps its default. A name outside 1 to 40 characters (after trimming),
        a missing or unknown `kind`, or a setting that is not a boolean is 422; a name another
        game has, ignoring case, is 409 `duplicate-name`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewGame'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Game'
        '401':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '415':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
  /api/games/{id}:
    parameters:
      - $ref: '#/components/parameters/GameId'
    get:
      operationId: getGame
      summary: A game with the number of its matches or results of every run (for the delete dialog)
      responses:
        '200':
          description: The game
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GameDetail'
        '401':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
    patch:
      operationId: updateGame
      summary: Rename a game or change its kind's setting; the kind itself is fixed
      description: >-
        `name` is required; an omitted setting stays as it is, and the other kind's setting is
        ignored. The ranking follows a new setting at once. `kind` may be sent only as the
        game's own kind: another one is 422.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GameChange'
      responses:
        '200':
          description: Changed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Game'
        '401':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '415':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
    delete:
      operationId: deleteGame
      summary: Delete a game with all of its matches or results, of every run
      description: >-
        The audit log records the game's deletion and one deletion, caused by it, for each of
        its matches or results.
      responses:
        '204':
          description: Deleted
        '401':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
  /api/games/{id}/restart:
    parameters:
      - $ref: '#/components/parameters/GameId'
    post:
      operationId: restartGame
      summary: Start the game's next run from now; older results stay stored but are no longer shown
      description: >-
        Takes no fields, but like every request body it must be JSON: send `{}`. A recording
        that is saving while the game restarts belongs to the run it committed in, the old one
        if it finished first, the new one otherwise.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: Restarted; `startedAt` is now
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Game'
        '401':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '415':
          $ref: '#/components/responses/Problem'
  /api/games/{id}/standings:
    parameters:
      - $ref: '#/components/parameters/GameId'
    get:
      operationId: getStandings
      summary: The game's ranking in its current run, tagged with the game's kind
      description: >-
        Duel game: every person with a match in the current run, by points (win 1, draw ½,
        loss 0), then wins, then name. Rankings are computed from the stored outcome, so a
        deleted person's side counts for no one and never changes the other side's result.
        Points game: no rows until results can be recorded. The ETag is the data revision,
        read in the same snapshot as the ranking; every game and match write bumps it, so
        `If-None-Match` with the last ETag answers 304 without ranking while nothing changed.
      parameters:
        - name: If-None-Match
          in: header
          required: false
          description: The ETag of the ranking the client already shows
          schema:
            type: string
            examples: ['"42"']
      responses:
        '200':
          description: The ranking
          headers:
            ETag:
              description: The data revision of this ranking
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Standings'
        '304':
          description: Unchanged since the ranking named in `If-None-Match`
          headers:
            ETag:
              description: The same ETag
              schema:
                type: string
        '401':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
  /api/matches/{id}:
    parameters:
      - $ref: '#/components/parameters/ClientId'
    put:
      operationId: recordMatch
      summary: Record a match of a duel game, idempotently on its id
      description: >-
        The match is recorded in the game's current run, with the account and the server time
        (UTC). A repeated request with the same id and content answers 200 with the original
        match and records nothing, even after the match was deleted or its game deleted; the
        same id with other content, or an id already used for an entry, answers 409
        `request-conflict`. Ids are remembered for seven days. An unknown game is 404; the
        same person twice, an unknown person, an unknown outcome, `draw` while the game's
        `drawsAllowed` is off, or a points game is 422.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewMatch'
      responses:
        '200':
          description: Already recorded by an earlier request with this id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Match'
        '201':
          description: Recorded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Match'
        '401':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '415':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
    delete:
      operationId: deleteMatch
      summary: Delete a match (undo); its id stays known, so a late retry cannot bring it back
      responses:
        '204':
          description: Deleted
        '401':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
  /api/audit:
    get:
      operationId: listAuditEvents
      summary: A page of audit events, newest first (admins only)
      description: >-
        The audit log is application-level append-only history: every create, update and
        delete of a person, a drink, a factor or a game (a restart is an update of its `run`
        and `startedAt`), and every entry counted or deleted and every match recorded or
        deleted (a game's deletion records one for each of its matches, caused by it), recorded
        in the transaction of the change with the acting account and the values before and
        after. A write that fails, a replayed entry or match request, and an update that changes no
        value record nothing. No route changes or deletes an event (other methods on this
        path answer 405), and reading the log does not change the data revision. Pages run
        newest first by event id: `before` reads only older events, `limit` sets the page size,
        and `next` is the `before` of the next older page. A `before` that is not a positive
        integer, or a `limit` outside 1 to 100, is 422.
      parameters:
        - name: before
          in: query
          required: false
          description: An event id; only older events are returned. Omitted, the page starts at the newest event.
          schema:
            type: integer
            minimum: 1
        - name: limit
          in: query
          required: false
          description: Events per page
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: A page of events, newest first
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditPage'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
components:
  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: session
  parameters:
    GameId:
      name: id
      in: path
      required: true
      description: The game's id; anything but a positive integer is 404
      schema:
        type: integer
        minimum: 1
    ClientId:
      name: id
      in: path
      required: true
      description: >-
        The client-generated UUID v4 (lower case) of a match, also its retry key; unique across
        entries and matches. Anything else is 404.
      schema:
        type: string
        pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$'
  responses:
    Problem:
      description: An error, described as a problem
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    TooManyAttempts:
      description: Five failed sign-ins for this user name and address in 15 minutes
      headers:
        Retry-After:
          description: Seconds until the window of the oldest failure has passed, at most
          schema:
            type: integer
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    Account:
      type: object
      additionalProperties: false
      required: [id, userName, isAdmin]
      properties:
        id:
          type: integer
          minimum: 1
        userName:
          type: string
          minLength: 1
          maxLength: 40
          examples: ['anna']
        isAdmin:
          type: boolean
    AccountList:
      type: object
      additionalProperties: false
      required: [accounts]
      properties:
        accounts:
          type: array
          items:
            $ref: '#/components/schemas/Account'
    SignIn:
      type: object
      required: [userName, password]
      properties:
        userName:
          type: string
        password:
          type: string
    PasswordChange:
      type: object
      required: [currentPassword, newPassword]
      properties:
        currentPassword:
          type: string
        newPassword:
          type: string
          description: At least 10 characters and at most 72 bytes in UTF-8 (bcrypt ignores the rest), no NUL character; otherwise 422 with a field error
          minLength: 10
    NewAccount:
      type: object
      required: [userName, password]
      properties:
        userName:
          type: string
          description: Trimmed; 1–40 characters; unique regardless of case
          maxLength: 40
        password:
          type: string
          description: The start password. At least 10 characters and at most 72 bytes in UTF-8 (bcrypt ignores the rest), no NUL character; otherwise 422 with a field error
          minLength: 10
    AccountChange:
      type: object
      properties:
        isAdmin:
          type: boolean
          description: Grant (true) or revoke (false) admin rights
        password:
          type: string
          description: The new password (a reset); signs the account out everywhere. At least 10 characters and at most 72 bytes in UTF-8 (bcrypt ignores the rest), no NUL character; otherwise 422 with a field error
          minLength: 10
    Name:
      type: string
      description: Trimmed; 1–40 characters; unique regardless of case
      minLength: 1
      maxLength: 40
    Person:
      type: object
      additionalProperties: false
      required: [id, name]
      properties:
        id:
          type: integer
          minimum: 1
        name:
          $ref: '#/components/schemas/Name'
    PersonDetail:
      type: object
      additionalProperties: false
      required: [id, name, entryCount, matchCount]
      properties:
        id:
          type: integer
          minimum: 1
        name:
          $ref: '#/components/schemas/Name'
        entryCount:
          type: integer
          minimum: 0
          description: Entries of every day that are the person's; deleting the person deletes them
        matchCount:
          type: integer
          minimum: 0
          description: Matches of every game and run that name the person on either side; deleting the person keeps them with that side cleared
    PersonList:
      type: object
      additionalProperties: false
      required: [persons]
      properties:
        persons:
          type: array
          items:
            $ref: '#/components/schemas/Person'
    NewPerson:
      type: object
      required: [name]
      properties:
        name:
          $ref: '#/components/schemas/Name'
    Points:
      type: number
      description: Alcohol base points, 0–9 999.99 with at most two decimals
      minimum: 0
      maximum: 9999.99
      multipleOf: 0.01
    Drink:
      type: object
      additionalProperties: false
      required: [id, name, points]
      properties:
        id:
          type: integer
          minimum: 1
        name:
          $ref: '#/components/schemas/Name'
        points:
          $ref: '#/components/schemas/Points'
    DrinkDetail:
      type: object
      additionalProperties: false
      required: [id, name, points, entryCount]
      properties:
        id:
          type: integer
          minimum: 1
        name:
          $ref: '#/components/schemas/Name'
        points:
          $ref: '#/components/schemas/Points'
        entryCount:
          type: integer
          minimum: 0
          description: Entries of every day that are of the drink
    DrinkList:
      type: object
      additionalProperties: false
      required: [drinks]
      properties:
        drinks:
          type: array
          items:
            $ref: '#/components/schemas/Drink'
    NewDrink:
      type: object
      required: [name, points]
      properties:
        name:
          $ref: '#/components/schemas/Name'
        points:
          $ref: '#/components/schemas/Points'
    Multiplier:
      type: number
      description: Above 0 up to 99.99 with at most two decimals
      exclusiveMinimum: 0
      maximum: 99.99
      multipleOf: 0.01
    Factor:
      type: object
      additionalProperties: false
      required: [id, name, multiplier]
      properties:
        id:
          type: integer
          minimum: 1
        name:
          $ref: '#/components/schemas/Name'
        multiplier:
          $ref: '#/components/schemas/Multiplier'
    FactorDetail:
      type: object
      additionalProperties: false
      required: [id, name, multiplier, entryCount]
      properties:
        id:
          type: integer
          minimum: 1
        name:
          $ref: '#/components/schemas/Name'
        multiplier:
          $ref: '#/components/schemas/Multiplier'
        entryCount:
          type: integer
          minimum: 0
          description: Entries of every day that use the factor
    FactorList:
      type: object
      additionalProperties: false
      required: [factors]
      properties:
        factors:
          type: array
          items:
            $ref: '#/components/schemas/Factor'
    NewFactor:
      type: object
      required: [name, multiplier]
      properties:
        name:
          $ref: '#/components/schemas/Name'
        multiplier:
          $ref: '#/components/schemas/Multiplier'
    Quantity:
      type: integer
      minimum: 1
      maximum: 99
    NewEntry:
      type: object
      required: [personId, drinkId, quantity]
      properties:
        personId:
          type: integer
        drinkId:
          type: integer
        quantity:
          $ref: '#/components/schemas/Quantity'
        factorId:
          type: [integer, 'null']
          description: The chosen factor; missing or null for no factor (counts ×1)
    Entry:
      type: object
      additionalProperties: false
      required: [id, personId, drinkId, quantity, factorId, createdAt]
      properties:
        id:
          type: string
        personId:
          type: integer
        drinkId:
          type: integer
        quantity:
          $ref: '#/components/schemas/Quantity'
        factorId:
          type: [integer, 'null']
          description: The factor of the request; null for none
        createdAt:
          type: string
          format: date-time
          description: Server time of the first request, UTC
          examples: ['2026-11-14T22:41:07.123Z']
    EntryHistory:
      type: object
      additionalProperties: false
      required: [entries]
      properties:
        entries:
          type: array
          description: Newest first
          items:
            $ref: '#/components/schemas/HistoryEntry'
    HistoryEntry:
      type: object
      additionalProperties: false
      required: [id, drink, quantity, factor, createdAt, accountName]
      properties:
        id:
          type: string
        drink:
          type: object
          additionalProperties: false
          required: [id, name]
          properties:
            id:
              type: integer
            name:
              type: string
        quantity:
          $ref: '#/components/schemas/Quantity'
        factor:
          oneOf:
            - type: 'null'
            - type: object
              additionalProperties: false
              required: [id, name, multiplier]
              properties:
                id:
                  type: integer
                name:
                  type: string
                multiplier:
                  type: number
          description: The factor with its current multiplier; null for none or a deleted factor
        createdAt:
          type: string
          format: date-time
          description: Server time of the entry, UTC
          examples: ['2026-11-14T22:41:07.123Z']
        accountName:
          type: [string, 'null']
          description: User name of the account that logged it; null once that account was deleted
    Scoreboard:
      type: object
      additionalProperties: false
      required: [rows]
      properties:
        rows:
          type: array
          description: Ranked by score, ties by name; persons without entries are absent
          items:
            $ref: '#/components/schemas/ScoreRow'
    ScoreRow:
      type: object
      additionalProperties: false
      required: [personId, name, score, count, drinks]
      properties:
        personId:
          type: integer
        name:
          type: string
        score:
          type: number
        count:
          type: number
        drinks:
          type: array
          description: By drink name; only drinks with entries
          items:
            $ref: '#/components/schemas/DrinkCount'
    DrinkCount:
      type: object
      additionalProperties: false
      required: [drinkId, name, count]
      properties:
        drinkId:
          type: integer
        name:
          type: string
        count:
          type: number
    GameKind:
      type: string
      enum: [duel, points]
      description: '`duel`: two persons and an outcome. `points`: one person and a whole number.'
    Game:
      type: object
      additionalProperties: false
      required: [id, name, kind, drawsAllowed, lowerWins, startedAt]
      properties:
        id:
          type: integer
          minimum: 1
        name:
          $ref: '#/components/schemas/Name'
        kind:
          $ref: '#/components/schemas/GameKind'
        drawsAllowed:
          type: boolean
          description: Duel games only (points games always say true); whether `draw` can be recorded
        lowerWins:
          type: boolean
          description: Points games only (duel games always say false); whether the lowest sum ranks first
        startedAt:
          type: string
          format: date-time
          description: When the current run began (creation or last restart), UTC; for display (`seit …`)
    GameDetail:
      type: object
      additionalProperties: false
      required:
        [
          id,
          name,
          kind,
          drawsAllowed,
          lowerWins,
          startedAt,
          matchCount,
          resultCount,
        ]
      properties:
        id:
          type: integer
          minimum: 1
        name:
          $ref: '#/components/schemas/Name'
        kind:
          $ref: '#/components/schemas/GameKind'
        drawsAllowed:
          type: boolean
        lowerWins:
          type: boolean
        startedAt:
          type: string
          format: date-time
        matchCount:
          type: integer
          minimum: 0
          description: Every stored match of the game, of every run; 0 for a points game
        resultCount:
          type: integer
          minimum: 0
          description: Every stored result of the game, of every run; 0 for a duel game
    GameList:
      type: object
      additionalProperties: false
      required: [games]
      properties:
        games:
          type: array
          items:
            $ref: '#/components/schemas/Game'
    NewGame:
      type: object
      required: [name, kind]
      properties:
        name:
          $ref: '#/components/schemas/Name'
        kind:
          $ref: '#/components/schemas/GameKind'
        drawsAllowed:
          type: boolean
          description: Duel games; default true
        lowerWins:
          type: boolean
          description: Points games; default false
    GameChange:
      type: object
      required: [name]
      properties:
        name:
          $ref: '#/components/schemas/Name'
        kind:
          $ref: '#/components/schemas/GameKind'
          description: Optional; only the game's own kind is accepted
        drawsAllowed:
          type: boolean
          description: Duel games; omitted, it stays
        lowerWins:
          type: boolean
          description: Points games; omitted, it stays
    Outcome:
      type: string
      enum: [first, second, draw]
      description: How a match ended, from the first person's side
    NewMatch:
      type: object
      required: [gameId, firstPersonId, secondPersonId, outcome]
      properties:
        gameId:
          type: integer
        firstPersonId:
          type: integer
        secondPersonId:
          type: integer
          description: Another person than `firstPersonId`
        outcome:
          $ref: '#/components/schemas/Outcome'
    Match:
      type: object
      additionalProperties: false
      required: [id, gameId, firstPersonId, secondPersonId, outcome, createdAt]
      properties:
        id:
          type: string
        gameId:
          type: integer
        firstPersonId:
          type: integer
        secondPersonId:
          type: integer
        outcome:
          $ref: '#/components/schemas/Outcome'
        createdAt:
          type: string
          format: date-time
          description: Server time of the first request, UTC
          examples: ['2026-11-14T22:41:07.123Z']
    Standings:
      oneOf:
        - $ref: '#/components/schemas/DuelStandings'
        - $ref: '#/components/schemas/PointsStandings'
      discriminator:
        propertyName: kind
        mapping:
          duel: '#/components/schemas/DuelStandings'
          points: '#/components/schemas/PointsStandings'
    DuelStandings:
      type: object
      additionalProperties: false
      required: [kind, startedAt, rows]
      properties:
        kind:
          type: string
          const: duel
        startedAt:
          type: string
          format: date-time
          description: When the current run began, UTC
        rows:
          type: array
          description: Ranked by points, then wins, then name; persons without a match in the run are absent
          items:
            $ref: '#/components/schemas/DuelRow'
    DuelRow:
      type: object
      additionalProperties: false
      required: [personId, name, points, wins, draws, losses, played]
      properties:
        personId:
          type: integer
        name:
          type: string
        points:
          type: number
          description: Win 1, draw 0.5, loss 0
        wins:
          type: integer
        draws:
          type: integer
        losses:
          type: integer
        played:
          type: integer
    PointsStandings:
      type: object
      additionalProperties: false
      required: [kind, startedAt, lowerWins, rows]
      properties:
        kind:
          type: string
          const: points
        startedAt:
          type: string
          format: date-time
          description: When the current run began, UTC
        lowerWins:
          type: boolean
        rows:
          type: array
          description: Ranked by the sum in the game's direction, then name; empty until results can be recorded
          items:
            $ref: '#/components/schemas/PointsRow'
    PointsRow:
      type: object
      additionalProperties: false
      required: [personId, name, sum, results]
      properties:
        personId:
          type: integer
        name:
          type: string
        sum:
          type: integer
        results:
          type: integer
    AuditPage:
      type: object
      additionalProperties: false
      required: [events, next]
      properties:
        events:
          type: array
          description: Newest first, by id
          items:
            $ref: '#/components/schemas/AuditEvent'
        next:
          type: [integer, 'null']
          minimum: 1
          description: >-
            The `before` of the next older page; null when no older event exists, so a last page
            that is exactly full is not followed by an empty one
    AuditEvent:
      type: object
      additionalProperties: false
      required:
        [
          id,
          occurredAt,
          operation,
          subjectKind,
          subjectId,
          actor,
          before,
          after,
          cause,
        ]
      properties:
        id:
          type: integer
          minimum: 1
          description: Sequential; a later event has a larger id
        occurredAt:
          type: string
          format: date-time
          description: Server time of the change, UTC
          examples: ['2026-11-14T22:41:07.123Z']
        operation:
          type: string
          enum: [create, update, delete]
        subjectKind:
          type: string
          enum: [entry, person, drink, factor, game, match]
        subjectId:
          type: string
          description: The subject's id as text (an integer for persons, drinks, factors and games, the UUID for entries)
        actor:
          type: object
          additionalProperties: false
          required: [accountId, userName]
          description: The account that made the change, as it was then; kept after the account is renamed or deleted
          properties:
            accountId:
              type: integer
            userName:
              type: string
        before:
          description: The subject's values before the change; null for a create
          oneOf:
            - type: 'null'
            - $ref: '#/components/schemas/AuditSnapshot'
        after:
          description: The subject's values after the change; null for a delete
          oneOf:
            - type: 'null'
            - $ref: '#/components/schemas/AuditSnapshot'
        cause:
          description: >-
            The event whose change caused this one, null for a direct change. An entry removed
            or changed by the deletion of its person, drink or factor names that deletion here,
            so it can be shown when the deletion's own event is on another page.
          oneOf:
            - type: 'null'
            - type: object
              additionalProperties: false
              required: [id, subjectKind, name]
              properties:
                id:
                  type: integer
                  description: The causing event's id
                subjectKind:
                  type: string
                  enum: [entry, person, drink, factor, game, match]
                name:
                  type: string
                  description: The causing event's subject name, as that event recorded it
    AuditSnapshot:
      type: object
      description: >-
        The subject's values as they were, with referenced names resolved then: a person
        `{name}`, a drink `{name, points}`, a factor `{name, multiplier}`, an entry
        `{person, drink, points, quantity, factor}` with the person's and the drink's names,
        the drink's points, and the factor `{name, multiplier}` or null, a game
        `{name, kind, drawsAllowed, run, startedAt}` for a duel game and
        `{name, kind, lowerWins, run, startedAt}` for a points game, a match
        `{game, first, second, outcome}` with the game's and both persons' names (a person
        deleted before is null). Keys are only ever
        added, never renamed, removed or given a new meaning; a reader treats a key it does
        not know, or a missing one, as unknown.
      additionalProperties: true
      properties:
        name:
          type: string
        points:
          type: number
        multiplier:
          type: number
        person:
          type: string
        drink:
          type: string
        quantity:
          type: integer
        kind:
          type: string
        drawsAllowed:
          type: boolean
        lowerWins:
          type: boolean
        run:
          type: integer
        startedAt:
          type: string
          format: date-time
        game:
          type: string
        first:
          type: [string, 'null']
        second:
          type: [string, 'null']
        outcome:
          $ref: '#/components/schemas/Outcome'
        factor:
          oneOf:
            - type: 'null'
            - type: object
              description: >-
                The factor's values, under the same rule as the snapshot: keys are only ever
                added, and a missing one is unknown.
              additionalProperties: true
              properties:
                name:
                  type: string
                multiplier:
                  type: number
    Health:
      type: object
      additionalProperties: false
      required:
        - appVersion
        - phpVersion
        - database
        - schemaVersion
        - migration
        - minClientVersion
      properties:
        appVersion:
          type: string
          description: Version of the release that answered, `MAJOR.MINOR.PATCH` with optional build metadata
          examples: ['0.1.0+3f2a1bc']
        phpVersion:
          type: string
          examples: ['8.5.12']
        database:
          type: object
          additionalProperties: false
          required: [engine, version]
          properties:
            engine:
              type: string
              enum: [MySQL, MariaDB]
            version:
              type: string
              examples: ['11.8.8']
        schemaVersion:
          type: integer
          minimum: 0
          description: Number of the newest migration up to which every migration is completed
        migration:
          $ref: '#/components/schemas/MigrationState'
        minClientVersion:
          type: string
          description: The oldest web client version the API still serves; older clients must reload
          examples: ['0.1.0']
    MigrationState:
      type: string
      enum: [ok, running, failed]
    Problem:
      type: object
      required: [type, title, status]
      properties:
        type:
          type: string
          format: uri
          enum:
            - urn:performance:problem:bad-request
            - urn:performance:problem:unauthenticated
            - urn:performance:problem:invalid-credentials
            - urn:performance:problem:forbidden
            - urn:performance:problem:duplicate-user-name
            - urn:performance:problem:duplicate-name
            - urn:performance:problem:last-admin
            - urn:performance:problem:entry-conflict
            - urn:performance:problem:request-conflict
            - urn:performance:problem:unsupported-media-type
            - urn:performance:problem:validation
            - urn:performance:problem:too-many-attempts
            - urn:performance:problem:not-found
            - urn:performance:problem:method-not-allowed
            - urn:performance:problem:internal
            - urn:performance:problem:maintenance
            - urn:performance:problem:migration-failed
        title:
          type: string
          description: German, shown to the user as is
        status:
          type: integer
        errors:
          type: object
          description: Field validation errors, keyed by field name
          additionalProperties:
            type: string
