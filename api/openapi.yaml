  /api/games/{id}/standings:
    parameters:
      - $ref: '#/components/parameters/ClientVersion'
      - $ref: '#/components/parameters/GameId'
    get:
      operationId: getStandings
      summary: The game's ranking in its current run, a window `[from, to)` or all time, tagged with the game's kind
      description: >-
        The selection is exactly one of: nothing, the current run since the last (re)start,
        answered and tagged exactly as before the standings took a window; a window, from
        `from` on and before `to` when it is given; or all time with `scope=all`. A window
        and all time rank every verified match or result of the game recorded in them,
        whatever its run; a row belongs to the window it was recorded in, whenever it was
        verified. A `from` or `to` that is no instant, a `to` not after `from`, a `to`
        without `from`, another `scope` than `all`, or `scope=all` together with `from` or
        `to` is 422, exactly as for the scoreboard.
        Duel game: every person with a match in the selection, by points (win 1, draw ½,
        loss 0), then wins, then name; across runs each verified match adds its result to
        both its players once. Rankings are computed from the stored outcome, so a deleted
        person's side counts for no one and never changes the other side's result.
        Points game: every person with a result in the selection, by the `measure`, the sum
        of their points (the current run always) or their average per verified result, the
        lowest first when `lowerWins` is on and the highest otherwise, then name, then id; the
        exact average decides, never the rounded `average` sent. Across runs each verified
        result is one attempt, added to the sum and to `results`, which divides it. A
        `measure` other than `sum` or `average`, a `measure` on a duel game, or one without
        `from` or `scope=all` is 422, so it never changes the current run's answer. A
        changed `lowerWins` re-ranks at once. The ETag names the data revision, read in the
        same snapshot as the ranking, and the selection: the bare revision for the current
        run, the revision and the window or `all` otherwise, followed by `-average` when the
        average ranks. Every game, match and result write bumps the revision, so
        `If-None-Match` with the last ETag of the same selection and measure answers 304
        without ranking while nothing changed.
      parameters:
        - name: from
          in: query
          required: false
          description: >-
            Start of the window (inclusive), such as local midnight of a chosen day, as an
            ISO-8601 instant with offset. Without `from`, `to` and `scope` the current run
            is ranked.
          schema:
            type: string
            format: date-time
            examples: ['2026-11-14T23:00:00.000Z']
        - $ref: '#/components/parameters/WindowTo'
        - $ref: '#/components/parameters/AllTimeScope'
        - name: measure
          in: query
          required: false
          description: >-
            What ranks a points game's window or all time: the sum of the verified points
            (the default) or their average per verified result. Only for a points game
            together with `from` or `scope=all`.
          schema:
            type: string
            enum: [sum, average]
            default: sum
        - name: If-None-Match
          in: header
          required: false
          description: The ETag of the ranking the client already shows
          schema:
            type: string
            examples:
              [
                '"42"',
                '"42-1763161200000-1763247600000"',
                '"42-all"',
                '"42-all-average"',
              ]
      responses:
        '200':
          description: The ranking
          headers:
            ETag:
              description: Data revision, selection and measure of this ranking
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Standings'
        '304':
          description: Unchanged since the ranking named in `If-None-Match`
          headers:
            ETag:
              description: The same ETag
              schema:
                type: string
        '401':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
  /api/games/{id}/standings/days:
    parameters:
      - $ref: '#/components/parameters/ClientVersion'
      - $ref: '#/components/parameters/GameId'
    get:
      operationId: getStandingsDays
      summary: The days the game was played in a window of at most 35 days or of all time, as sessions of quarter hours with a verified match or result
      description: >-
        The raw material of a game page's calendar marks (a month's window) and its
        `Gesamt` line (all time): the spans, ascending, of the sessions with at least one
        match or result of the game that counts, in every run, with exactly the standings'
        rule: verified matches with at least one side that still names a person (a duel
        match counts once although it counts for two players), verified results of persons
        who still exist; pending rows are left out. The selection is checked before the
        game is looked up; an unknown game is 404.
        Each span runs from the start of a session's first 15-minute UTC bucket with a row
        that counts to the end of its last; a pause shorter than 6 hours without such a row
        does not end a session, so an evening is one span. The bucket of a row is decided by
        its recording instant alone, never by its verification, so a row recorded before
        midnight and verified the next day stays in the bucket it was recorded in. Every UTC
        offset in use is a multiple of 15 minutes and every local day is longer than 6 hours,
        so the client finds its local days exactly: a local day has data when a span
        overlaps it (a span over local midnight touches both days); the server knows no time
        zone. The selection is exactly one of: a window `[from, to)` of at most 35 days, the
        calendar's month (a window answers the spans of its own rows, cut at its bounds, and
        seeks them by recording instant), or all time with `scope=all`, the `Gesamt` line. A
        missing or invalid `from` or `to`, a `to` not after `from` or more than 35 days after
        it, another `scope` than `all`, or `scope=all` together with `from` or `to` is 422,
        as for the scoreboard. The size grows with the evenings that have rows, never with
        the rows or their quarter hours: a month is a few hundred bytes, five years of
        evenings a few ten kilobytes. The ETag names the data revision, read in the same
        snapshot as the spans, and the selection; every write, verification and deletion
        bumps the revision, so `If-None-Match` with the last ETag of the same selection
        answers 304 without reading while nothing changed.
      parameters:
        - $ref: '#/components/parameters/DaysFrom'
        - $ref: '#/components/parameters/DaysTo'
        - $ref: '#/components/parameters/AllTimeScope'
        - name: If-None-Match
          in: header
