# Checks every pull request and every push to main without deploying (deploy
# follows in slice 1/4). One job builds the artifact; the e2e job tests those
# bytes. Provisional runtime: the runner's PHP 8.3 and MySQL 8.4 until the host
# probe (#2) pins the host's versions.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NPM_CONFIG_AUDIT: 'false'
  NPM_CONFIG_FUND: 'false'

jobs:
  build:
    name: Build artifact
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      digest: ${{ steps.digest.outputs.sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Build web root and PHP release
        run: node scripts/build-artifact.ts
      - id: digest
        name: Record the digest
        run: |
          set -euo pipefail
          read -r sha256 file < <(cat dist/*.tar.gz.sha256)
          echo "sha256=$sha256" >>"$GITHUB_OUTPUT"
          printf '### Artifact\n\n`%s`\n\nsha256 `%s`\n' "$file" "$sha256" >>"$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: performance-artifact
          path: |
            dist/*.tar.gz
            dist/*.tar.gz.sha256
          if-no-files-found: error

  static:
    name: Static checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: ESLint
        run: npm run lint
      - name: Prettier
        run: npm run format:check
      - name: TypeScript and vue-tsc
        run: npm run typecheck
      - name: OpenAPI type drift
        run: npm run check:api-types
      - name: Secrets
        run: npm run lint:secrets
      - name: Composer
        working-directory: api
        run: composer install --no-interaction --no-progress
      - name: PHPStan (max)
        working-directory: api
        run: composer analyse -- --no-progress
      - name: PHP-CS-Fixer
        working-directory: api
        run: composer cs

  unit:
    name: Vitest
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm test

  phpunit:
    name: PHPUnit (MySQL)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval 2s --health-timeout 2s --health-retries 60
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: '3306'
      DB_USER: root
      DB_PASS: root
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: PHP and extensions
        run: php -v && php -m | grep -x pdo_mysql
      - name: Composer
        working-directory: api
        run: composer install --no-interaction --no-progress
      - name: PHPUnit
        working-directory: api
        run: composer test

  preview:
    name: Fixture preview
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build:preview
      - run: npx playwright install --with-deps chromium
      - name: Smoke test
        run: npx playwright test --project 'preview-*'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fixture-preview
          path: web/dist-preview
          if-no-files-found: error

  e2e:
    name: E2E and Lighthouse on the artifact
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      STACK_ROOT: ${{ github.workspace }}/stack-root
      E2E_WEB_ROOT: dist/artifact/web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: performance-artifact
          path: dist
      - name: Verify the digest and unpack
        env:
          DIGEST: ${{ needs.build.outputs.digest }}
        run: |
          set -euo pipefail
          cd dist
          sha256sum --check --strict ./*.tar.gz.sha256
          grep -q "^$DIGEST " ./*.tar.gz.sha256
          mkdir artifact
          tar -xzf ./*.tar.gz -C artifact
      - name: Stage the webspace with the rendered .htaccess
        run: e2e/stack/stage.sh dist/artifact "$STACK_ROOT" http://localhost:8080
      - name: Start Apache + PHP + MySQL
        run: docker compose -f e2e/stack/compose.yml up --build --detach --wait
      - run: npx playwright install --with-deps chromium
      - name: Playwright e2e (CSP guard)
        run: npx playwright test --project 'stack-*'
      - name: Lighthouse
        run: npx lhci autorun
      - name: Stack logs
        if: failure()
        run: docker compose -f e2e/stack/compose.yml logs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: e2e-report
          path: |
            playwright-report
            .lighthouseci
