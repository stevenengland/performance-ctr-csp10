# Throwaway host probe for slice 1/1 (#2). Removed again once the findings are recorded:
# it reads deploy secrets, which later only `_deploy.yml` may do.
#
# Each input role accepts several names (repository variable or secret, first match wins);
# passwords are read from secrets only, so no password can reach a log as a variable.
name: host-probe

on:
  push:
    branches: [claude/exciting-einstein-xtpbdb]
    paths:
      - .github/workflows/host-probe.yml
      - scripts/host-probe/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: host-probe
  cancel-in-progress: false

jobs:
  presence:
    name: Which names are set (no values)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      ok: ${{ steps.check.outputs.ok }}
    steps:
      - id: check
        name: Report variables and secrets by name only
        run: |
          set -euo pipefail
          declare -A role_name role_kind
          row() { # role, name, is-variable, is-secret
            if [ "$3" = true ] || [ "$4" = true ]; then
              printf '| %s | `%s` | %s | %s |\n' "$1" "$2" "$3" "$4" >>"$GITHUB_STEP_SUMMARY"
              if [ -z "${role_name[$1]:-}" ]; then
                role_name[$1]=$2
                if [ "$4" = true ]; then role_kind[$1]=secret; else role_kind[$1]=variable; fi
              fi
            fi
          }
          {
            echo "## Names found (values never shown)"
            echo ""
            echo "| Role | Name | Variable | Secret |"
            echo "|---|---|---|---|"
          } >>"$GITHUB_STEP_SUMMARY"
          row site_url SITE_URL '${{ vars.SITE_URL != '' }}' '${{ secrets.SITE_URL != '' }}'
          row site_url PROD_SITE_URL '${{ vars.PROD_SITE_URL != '' }}' '${{ secrets.PROD_SITE_URL != '' }}'
          row site_url APP_URL '${{ vars.APP_URL != '' }}' '${{ secrets.APP_URL != '' }}'
          row site_url BASE_URL '${{ vars.BASE_URL != '' }}' '${{ secrets.BASE_URL != '' }}'
          row remote_root REMOTE_ROOT '${{ vars.REMOTE_ROOT != '' }}' '${{ secrets.REMOTE_ROOT != '' }}'
          row remote_root DEPLOY_REMOTE_ROOT '${{ vars.DEPLOY_REMOTE_ROOT != '' }}' '${{ secrets.DEPLOY_REMOTE_ROOT != '' }}'
          row remote_root PROD_REMOTE_ROOT '${{ vars.PROD_REMOTE_ROOT != '' }}' '${{ secrets.PROD_REMOTE_ROOT != '' }}'
          row docroot DOCROOT '${{ vars.DOCROOT != '' }}' '${{ secrets.DOCROOT != '' }}'
          row docroot DEPLOY_DOCROOT '${{ vars.DEPLOY_DOCROOT != '' }}' '${{ secrets.DEPLOY_DOCROOT != '' }}'
          row docroot WEB_ROOT '${{ vars.WEB_ROOT != '' }}' '${{ secrets.WEB_ROOT != '' }}'
          row docroot PROD_DEPLOY_DOCROOT '${{ vars.PROD_DEPLOY_DOCROOT != '' }}' '${{ secrets.PROD_DEPLOY_DOCROOT != '' }}'
          row deploy_host DEPLOY_HOST '${{ vars.DEPLOY_HOST != '' }}' '${{ secrets.DEPLOY_HOST != '' }}'
          row deploy_host SFTP_HOST '${{ vars.SFTP_HOST != '' }}' '${{ secrets.SFTP_HOST != '' }}'
          row deploy_host SSH_HOST '${{ vars.SSH_HOST != '' }}' '${{ secrets.SSH_HOST != '' }}'
          row deploy_host FTP_HOST '${{ vars.FTP_HOST != '' }}' '${{ secrets.FTP_HOST != '' }}'
          row deploy_host PROD_DEPLOY_HOST '${{ vars.PROD_DEPLOY_HOST != '' }}' '${{ secrets.PROD_DEPLOY_HOST != '' }}'
          row deploy_port DEPLOY_PORT '${{ vars.DEPLOY_PORT != '' }}' '${{ secrets.DEPLOY_PORT != '' }}'
          row deploy_port SFTP_PORT '${{ vars.SFTP_PORT != '' }}' '${{ secrets.SFTP_PORT != '' }}'
          row deploy_port SSH_PORT '${{ vars.SSH_PORT != '' }}' '${{ secrets.SSH_PORT != '' }}'
          row known_hosts DEPLOY_KNOWN_HOSTS '${{ vars.DEPLOY_KNOWN_HOSTS != '' }}' '${{ secrets.DEPLOY_KNOWN_HOSTS != '' }}'
          row known_hosts SFTP_KNOWN_HOSTS '${{ vars.SFTP_KNOWN_HOSTS != '' }}' '${{ secrets.SFTP_KNOWN_HOSTS != '' }}'
          row known_hosts KNOWN_HOSTS '${{ vars.KNOWN_HOSTS != '' }}' '${{ secrets.KNOWN_HOSTS != '' }}'
          row sftp_user DEPLOY_USER '${{ vars.DEPLOY_USER != '' }}' '${{ secrets.DEPLOY_USER != '' }}'
          row sftp_user SFTP_USER '${{ vars.SFTP_USER != '' }}' '${{ secrets.SFTP_USER != '' }}'
          row sftp_user SFTP_USERNAME '${{ vars.SFTP_USERNAME != '' }}' '${{ secrets.SFTP_USERNAME != '' }}'
          row sftp_user SSH_USER '${{ vars.SSH_USER != '' }}' '${{ secrets.SSH_USER != '' }}'
          row sftp_user FTP_USER '${{ vars.FTP_USER != '' }}' '${{ secrets.FTP_USER != '' }}'
          row sftp_user PROD_DEPLOY_USER '${{ vars.PROD_DEPLOY_USER != '' }}' '${{ secrets.PROD_DEPLOY_USER != '' }}'
          row sftp_password DEPLOY_PASSWORD '${{ vars.DEPLOY_PASSWORD != '' }}' '${{ secrets.DEPLOY_PASSWORD != '' }}'
          row sftp_password SFTP_PASSWORD '${{ vars.SFTP_PASSWORD != '' }}' '${{ secrets.SFTP_PASSWORD != '' }}'
          row sftp_password SSH_PASSWORD '${{ vars.SSH_PASSWORD != '' }}' '${{ secrets.SSH_PASSWORD != '' }}'
          row sftp_password FTP_PASSWORD '${{ vars.FTP_PASSWORD != '' }}' '${{ secrets.FTP_PASSWORD != '' }}'
          row sftp_password PROD_DEPLOY_PASSWORD '${{ vars.PROD_DEPLOY_PASSWORD != '' }}' '${{ secrets.PROD_DEPLOY_PASSWORD != '' }}'
          row db_host DB_HOST '${{ vars.DB_HOST != '' }}' '${{ secrets.DB_HOST != '' }}'
          row db_host DATABASE_HOST '${{ vars.DATABASE_HOST != '' }}' '${{ secrets.DATABASE_HOST != '' }}'
          row db_host MYSQL_HOST '${{ vars.MYSQL_HOST != '' }}' '${{ secrets.MYSQL_HOST != '' }}'
          row db_host PROD_DB_HOST '${{ vars.PROD_DB_HOST != '' }}' '${{ secrets.PROD_DB_HOST != '' }}'
          row db_port DB_PORT '${{ vars.DB_PORT != '' }}' '${{ secrets.DB_PORT != '' }}'
          row db_port DATABASE_PORT '${{ vars.DATABASE_PORT != '' }}' '${{ secrets.DATABASE_PORT != '' }}'
          row db_port MYSQL_PORT '${{ vars.MYSQL_PORT != '' }}' '${{ secrets.MYSQL_PORT != '' }}'
          row db_name DB_NAME '${{ vars.DB_NAME != '' }}' '${{ secrets.DB_NAME != '' }}'
          row db_name DB_DATABASE '${{ vars.DB_DATABASE != '' }}' '${{ secrets.DB_DATABASE != '' }}'
          row db_name DATABASE_NAME '${{ vars.DATABASE_NAME != '' }}' '${{ secrets.DATABASE_NAME != '' }}'
          row db_name MYSQL_DATABASE '${{ vars.MYSQL_DATABASE != '' }}' '${{ secrets.MYSQL_DATABASE != '' }}'
          row db_name PROD_DB_NAME '${{ vars.PROD_DB_NAME != '' }}' '${{ secrets.PROD_DB_NAME != '' }}'
          row db_user DB_USER '${{ vars.DB_USER != '' }}' '${{ secrets.DB_USER != '' }}'
          row db_user DB_USERNAME '${{ vars.DB_USERNAME != '' }}' '${{ secrets.DB_USERNAME != '' }}'
          row db_user DATABASE_USER '${{ vars.DATABASE_USER != '' }}' '${{ secrets.DATABASE_USER != '' }}'
          row db_user MYSQL_USER '${{ vars.MYSQL_USER != '' }}' '${{ secrets.MYSQL_USER != '' }}'
          row db_user PROD_DB_USER '${{ vars.PROD_DB_USER != '' }}' '${{ secrets.PROD_DB_USER != '' }}'
          row db_password DB_PASSWORD '${{ vars.DB_PASSWORD != '' }}' '${{ secrets.DB_PASSWORD != '' }}'
          row db_password DB_PASS '${{ vars.DB_PASS != '' }}' '${{ secrets.DB_PASS != '' }}'
          row db_password DATABASE_PASSWORD '${{ vars.DATABASE_PASSWORD != '' }}' '${{ secrets.DATABASE_PASSWORD != '' }}'
          row db_password MYSQL_PASSWORD '${{ vars.MYSQL_PASSWORD != '' }}' '${{ secrets.MYSQL_PASSWORD != '' }}'
          row db_password PROD_DB_PASSWORD '${{ vars.PROD_DB_PASSWORD != '' }}' '${{ secrets.PROD_DB_PASSWORD != '' }}'
          row bootstrap_user BOOTSTRAP_ADMIN_USER '${{ vars.BOOTSTRAP_ADMIN_USER != '' }}' '${{ secrets.BOOTSTRAP_ADMIN_USER != '' }}'
          row bootstrap_user ADMIN_USER '${{ vars.ADMIN_USER != '' }}' '${{ secrets.ADMIN_USER != '' }}'
          row bootstrap_secret BOOTSTRAP_ADMIN_PASSWORD_HASH '${{ vars.BOOTSTRAP_ADMIN_PASSWORD_HASH != '' }}' '${{ secrets.BOOTSTRAP_ADMIN_PASSWORD_HASH != '' }}'
          row bootstrap_secret BOOTSTRAP_ADMIN_PASSWORD '${{ vars.BOOTSTRAP_ADMIN_PASSWORD != '' }}' '${{ secrets.BOOTSTRAP_ADMIN_PASSWORD != '' }}'
          row bootstrap_secret ADMIN_PASSWORD '${{ vars.ADMIN_PASSWORD != '' }}' '${{ secrets.ADMIN_PASSWORD != '' }}'
          ok=true
          {
            echo ""
            echo "| Role | Resolved to | Kind | Needed |"
            echo "|---|---|---|---|"
          } >>"$GITHUB_STEP_SUMMARY"
          for role in site_url deploy_host sftp_user sftp_password db_host db_name db_user db_password remote_root docroot deploy_port known_hosts db_port bootstrap_user bootstrap_secret; do
            case $role in
              site_url|deploy_host|sftp_user|db_host|db_name|db_user) need=yes ;;
              sftp_password|db_password) need="yes, as secret" ;;
              *) need=optional ;;
            esac
            name=${role_name[$role]:-none}; kind=${role_kind[$role]:-—}
            printf '| %s | `%s` | %s | %s |\n' "$role" "$name" "$kind" "$need" >>"$GITHUB_STEP_SUMMARY"
            if [ "$need" = yes ] && [ "$name" = none ]; then ok=false; fi
            if [ "$need" = "yes, as secret" ] && [ "$kind" != secret ]; then ok=false; fi
          done
          echo "" >>"$GITHUB_STEP_SUMMARY"
          echo "Probe may run: **$ok**" >>"$GITHUB_STEP_SUMMARY"
          cat "$GITHUB_STEP_SUMMARY"
          echo "ok=$ok" >>"$GITHUB_OUTPUT"

  probe:
    name: Probe the Strato host
    needs: presence
    if: needs.presence.outputs.ok == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install sshpass
        run: sudo apt-get update -qq && sudo apt-get install -y -qq sshpass >/dev/null
      - name: Run the probe
        env:
          SITE_URL: ${{ vars.SITE_URL || secrets.SITE_URL || vars.PROD_SITE_URL || secrets.PROD_SITE_URL || vars.APP_URL || secrets.APP_URL || vars.BASE_URL || secrets.BASE_URL }}
          REMOTE_ROOT: ${{ vars.REMOTE_ROOT || secrets.REMOTE_ROOT || vars.DEPLOY_REMOTE_ROOT || secrets.DEPLOY_REMOTE_ROOT || vars.PROD_REMOTE_ROOT || secrets.PROD_REMOTE_ROOT }}
          DOCROOT: ${{ vars.DOCROOT || secrets.DOCROOT || vars.DEPLOY_DOCROOT || secrets.DEPLOY_DOCROOT || vars.WEB_ROOT || secrets.WEB_ROOT || vars.PROD_DEPLOY_DOCROOT || secrets.PROD_DEPLOY_DOCROOT }}
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST || secrets.DEPLOY_HOST || vars.SFTP_HOST || secrets.SFTP_HOST || vars.SSH_HOST || secrets.SSH_HOST || vars.FTP_HOST || secrets.FTP_HOST || vars.PROD_DEPLOY_HOST || secrets.PROD_DEPLOY_HOST }}
          DEPLOY_PORT: ${{ vars.DEPLOY_PORT || secrets.DEPLOY_PORT || vars.SFTP_PORT || secrets.SFTP_PORT || vars.SSH_PORT || secrets.SSH_PORT }}
          DEPLOY_KNOWN_HOSTS: ${{ vars.DEPLOY_KNOWN_HOSTS || secrets.DEPLOY_KNOWN_HOSTS || vars.SFTP_KNOWN_HOSTS || secrets.SFTP_KNOWN_HOSTS || vars.KNOWN_HOSTS || secrets.KNOWN_HOSTS }}
          SFTP_USER: ${{ vars.DEPLOY_USER || secrets.DEPLOY_USER || vars.SFTP_USER || secrets.SFTP_USER || vars.SFTP_USERNAME || secrets.SFTP_USERNAME || vars.SSH_USER || secrets.SSH_USER || vars.FTP_USER || secrets.FTP_USER || vars.PROD_DEPLOY_USER || secrets.PROD_DEPLOY_USER }}
          SSHPASS: ${{ secrets.DEPLOY_PASSWORD || secrets.SFTP_PASSWORD || secrets.SSH_PASSWORD || secrets.FTP_PASSWORD || secrets.PROD_DEPLOY_PASSWORD }}
          DB_HOST: ${{ vars.DB_HOST || secrets.DB_HOST || vars.DATABASE_HOST || secrets.DATABASE_HOST || vars.MYSQL_HOST || secrets.MYSQL_HOST || vars.PROD_DB_HOST || secrets.PROD_DB_HOST }}
          DB_PORT: ${{ vars.DB_PORT || secrets.DB_PORT || vars.DATABASE_PORT || secrets.DATABASE_PORT || vars.MYSQL_PORT || secrets.MYSQL_PORT }}
          DB_NAME: ${{ vars.DB_NAME || secrets.DB_NAME || vars.DB_DATABASE || secrets.DB_DATABASE || vars.DATABASE_NAME || secrets.DATABASE_NAME || vars.MYSQL_DATABASE || secrets.MYSQL_DATABASE || vars.PROD_DB_NAME || secrets.PROD_DB_NAME }}
          DB_USER: ${{ vars.DB_USER || secrets.DB_USER || vars.DB_USERNAME || secrets.DB_USERNAME || vars.DATABASE_USER || secrets.DATABASE_USER || vars.MYSQL_USER || secrets.MYSQL_USER || vars.PROD_DB_USER || secrets.PROD_DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD || secrets.DB_PASS || secrets.DATABASE_PASSWORD || secrets.MYSQL_PASSWORD || secrets.PROD_DB_PASSWORD }}
        run: bash scripts/host-probe/run.sh
