name: Live check
# Weekly check that production answers: GET <SITE_URL>/api/health must answer
# 200 with every health field and migration `ok`. A failure fails the run, and
# GitHub emails it. No secrets: health is public.
on:
  schedule:
    - cron: '17 5 * * 1'
  workflow_dispatch:
permissions: {}
jobs:
  live-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Check production health
        env:
          SITE_URL: ${{ vars.SITE_URL }}
        run: node deploy/cli.ts live-check
