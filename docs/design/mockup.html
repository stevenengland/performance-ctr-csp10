:root{
  --surface:#fbfaf4; --surface-low:#f4f2e8; --surface-container:#eceadc; --surface-high:#e3e0cf;
  --on-surface:#12261f; --on-surface-variant:#4c5f56; --outline:#7c8b82; --outline-variant:#cfd2c2;
  --primary:#14523f; --on-primary:#ffffff; --primary-container:#f6c453; --on-primary-container:#2a1c00;
  --secondary-container:#d5e6da; --on-secondary-container:#12261f;
  --tertiary:#b3264f; --tertiary-container:#ffd3de; --on-tertiary-container:#4a0a1e;
  --error:#b3261e; --error-container:#ffdad5; --on-error-container:#5c0f0a;
  --inverse-surface:#12261f; --inverse-on-surface:#f4f2e8; --inverse-primary:#f6c453;
  --page:#dedccb;
  --display:"Big Shoulders Display","Arial Narrow",sans-serif;
  --text:"Hanken Grotesk",system-ui,sans-serif;
}
:root[data-theme="dark"]{
  --surface:#0e1f1a; --surface-low:#132821; --surface-container:#183129; --surface-high:#213d34;
  --on-surface:#f1eddc; --on-surface-variant:#a9b8ae; --outline:#6f8277; --outline-variant:#2c463c;
  --primary:#f6c453; --on-primary:#2a1c00; --primary-container:#f6c453; --on-primary-container:#2a1c00;
  --secondary-container:#24493d; --on-secondary-container:#dff0e4;
  --tertiary:#ff8fab; --tertiary-container:#5e1a30; --on-tertiary-container:#ffd3de;
  --error:#ffb4a9; --error-container:#7a1b14; --on-error-container:#ffdad5;
  --inverse-surface:#f1eddc; --inverse-on-surface:#12261f; --inverse-primary:#14523f;
  --page:#07120f;
}
*{box-sizing:border-box;margin:0}
body{background:var(--page);color:var(--on-surface);font:400 16px/1.5 var(--text);padding:32px 24px 64px}
.intro{max-width:62ch;margin:0 auto 32px}
.intro h1{font:900 56px/0.95 var(--display);letter-spacing:.01em;text-transform:uppercase}
.intro p{margin-top:12px;color:var(--on-surface-variant)}
.intro button{margin-top:16px;font:600 14px var(--text);padding:10px 18px;border-radius:10px;border:1.5px solid var(--outline);background:none;color:var(--on-surface);cursor:pointer}
.intro button:focus-visible,.tile:focus-visible{outline:3px solid var(--tertiary);outline-offset:2px}
.wall{display:flex;flex-wrap:wrap;gap:36px 28px;justify-content:center}
figure{width:360px}
figcaption{font:600 14px var(--text);margin-bottom:10px;color:var(--on-surface-variant)}
.phone{height:720px;border-radius:28px;background:var(--surface);overflow:hidden;display:flex;flex-direction:column;position:relative;border:1px solid var(--outline-variant)}

/* app bar */
.bar{display:flex;align-items:center;gap:12px;padding:14px 16px 10px}
.bar h2{font:900 30px/1 var(--display);text-transform:uppercase;letter-spacing:.02em;flex:1}
.bar .ctx{font:600 14px var(--text);color:var(--on-surface-variant);text-transform:none;letter-spacing:0;display:block;margin-top:4px}
.icon{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:var(--on-surface)}
.icon svg{width:24px;height:24px;fill:currentColor}
.total{text-align:right;line-height:1}.total b{display:block;font:900 30px/1 var(--display);font-variant-numeric:tabular-nums}.total small{font:600 12px var(--text);color:var(--on-surface-variant)}
.steps{display:flex;gap:6px;padding:0 16px 4px}
.steps i{height:4px;flex:1;border-radius:2px;background:var(--outline-variant)}
.steps i.on{background:var(--primary)}
.q{font:700 22px/1.2 var(--display);letter-spacing:.02em;padding:14px 16px 10px;color:var(--on-surface-variant);text-transform:uppercase}
.body{flex:1;overflow:hidden;padding:0 16px 16px}

/* tiles */
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{background:var(--surface-high);border-radius:14px;min-height:104px;padding:12px 14px;display:flex;flex-direction:column;justify-content:space-between;border:0;color:var(--on-surface);text-align:left;font:inherit;box-shadow:inset 0 -3px 0 var(--outline-variant)}
.tile .name{font:900 28px/1 var(--display);text-transform:uppercase;letter-spacing:.015em}
.tile .sub{font:400 13px var(--text);color:var(--on-surface-variant)}
.tile .row{display:flex;justify-content:space-between;align-items:flex-end;gap:8px}
.tile .num{font:900 34px/0.9 var(--display);font-variant-numeric:tabular-nums}
.tile.pressed{background:var(--primary-container);color:var(--on-primary-container);box-shadow:none}
.tile.pressed .sub{color:inherit}
.tile.factor{background:var(--tertiary-container);color:var(--on-tertiary-container);box-shadow:none}
.tile.factor .sub{color:inherit}
.tile.off{opacity:.38}
.stepper{display:grid;grid-template-columns:88px 1fr 88px;gap:12px;align-items:center;margin-top:8px}
.stepper .tile{min-height:88px;align-items:center;justify-content:center}
.stepper .tile .num{font-size:56px}
.count{text-align:center}
.count b{display:block;font:900 128px/0.9 var(--display);font-variant-numeric:tabular-nums}
.count small{font:600 13px var(--text);color:var(--on-surface-variant)}
.delta{display:flex;flex-direction:column;align-items:center;gap:8px;margin:28px 0 24px;font:600 14px var(--text);color:var(--on-surface-variant)}
.t2{position:relative;display:block;height:34px}
.t2 .tally{height:34px;position:absolute;left:0;top:0}
.t2 .new .tally{color:var(--tertiary)}
.t2 .old{position:absolute;left:0;top:0;height:34px;overflow:hidden}
.t2 .old .tally{color:var(--on-surface)}
.qty{grid-template-columns:repeat(3,1fr)}
.qty .tile{min-height:112px;align-items:center;justify-content:center}
.qty .num{font-size:64px}
.link{display:block;margin:18px auto 0;font:600 15px var(--text);color:var(--primary);background:none;border:0;text-decoration:underline;text-underline-offset:4px}
.tally{display:block;height:22px;color:var(--primary)}
.pressed .tally,.leader .tally{color:var(--on-primary-container)}

/* nav */
.nav{display:grid;grid-template-columns:repeat(3,1fr);background:var(--surface-container);padding:8px 8px 12px}
.nav a{display:flex;flex-direction:column;align-items:center;gap:2px;font:600 12px var(--text);color:var(--on-surface-variant);text-decoration:none}
.nav a span{width:64px;height:32px;border-radius:16px;display:grid;place-items:center}
.nav a svg{width:24px;height:24px;fill:currentColor}
.nav a.on{color:var(--on-surface)}
.nav a.on span{background:var(--secondary-container);color:var(--on-secondary-container)}

/* snackbar + banner */
.snack{position:absolute;left:12px;right:12px;bottom:86px;background:var(--inverse-surface);color:var(--inverse-on-surface);border-radius:10px;padding:12px 8px 12px 16px;display:flex;align-items:center;gap:8px;font:600 14px var(--text);overflow:hidden}
.snack b{margin-left:auto;color:var(--inverse-primary);padding:6px 10px;font-weight:600}
.snack::after{content:"";position:absolute;left:0;bottom:0;height:3px;width:62%;background:var(--inverse-primary)}
.banner{background:var(--error-container);color:var(--on-error-container);font:600 13px/1.35 var(--text);padding:10px 16px;display:flex;gap:10px;align-items:center}
.banner svg{width:20px;height:20px;fill:currentColor;flex:none}

/* avatars (§6.12): the photo, or the initials on secondary-container; decorative */
.av{flex:none;display:inline-grid;place-items:center;border-radius:50%;overflow:hidden;background:var(--secondary-container);color:var(--on-secondary-container);font-family:var(--display);font-weight:900;line-height:1;letter-spacing:.02em}
.av.sunset{background:linear-gradient(#f7b267 0 30%,#e8665a 30% 58%,#5b3f6e 58%)}
.av.beer{background:linear-gradient(#fffaf0 0 30%,#f2b233 30% 80%,#c97a12 80%)}
.av.hills{background:linear-gradient(#bfe3f2 0 48%,#7cb35a 48% 72%,#3c7a43 72%)}
.tile .top{display:flex;align-items:center;gap:8px;min-width:0}
.leader .av{display:grid;margin:3px 0 6px 3px;box-shadow:0 0 0 3px var(--on-primary-container)}
/* ranking */
.leader{background:var(--primary-container);color:var(--on-primary-container);border-radius:18px;padding:16px 18px 14px;margin-bottom:10px}
.leader .top{display:flex;justify-content:space-between;align-items:flex-start}
.leader .name{font:900 44px/0.95 var(--display);text-transform:uppercase}
.leader .score{font:900 84px/0.8 var(--display);font-variant-numeric:tabular-nums}
.leader .meta{font:600 13px var(--text);margin-top:10px}.leader .meta span{display:block}
.rank{display:grid;grid-template-columns:28px 44px 1fr auto;align-items:center;gap:10px;padding:12px 4px;border-bottom:1px solid var(--outline-variant)}
.rank .pos{font:900 30px/1 var(--display);color:var(--on-surface-variant);text-align:center}
.rank .name{font:900 24px/1 var(--display);text-transform:uppercase}
.rank .sub{font:400 13px var(--text);color:var(--on-surface-variant);margin-top:3px}
.rank .score{font:900 34px/1 var(--display);font-variant-numeric:tabular-nums;text-align:right}
.rank .cnt{font:400 12px var(--text);color:var(--on-surface-variant);text-align:right}
.stand{font:600 12px var(--text);color:var(--error)}

/* lists, forms */
.item{display:flex;align-items:center;gap:8px;padding:12px 4px;border-bottom:1px solid var(--outline-variant)}
.item .main{flex:1}
.item .t{font:600 16px var(--text)}
.item .s{font:400 13px var(--text);color:var(--on-surface-variant)}
.fab{position:absolute;right:16px;bottom:92px;background:var(--primary);color:var(--on-primary);border-radius:14px;padding:14px 18px;font:600 15px var(--text);display:flex;gap:8px;align-items:center}
.fab svg{width:20px;height:20px;fill:currentColor}
.login{flex:1;display:flex;flex-direction:column;justify-content:center;padding:24px}
.login h2{font:900 64px/0.9 var(--display);text-transform:uppercase}
.login .tally{height:30px;margin:10px 0 28px}
.field{border:1.5px solid var(--outline);border-radius:10px;padding:8px 14px;margin-bottom:14px}
.field label{display:block;font:600 12px var(--text);color:var(--on-surface-variant)}
.field div{font:400 16px var(--text);min-height:24px}
.field.focus{border-color:var(--primary);border-width:2px}
.btn{background:var(--primary);color:var(--on-primary);border-radius:10px;padding:14px;text-align:center;font:600 16px var(--text)}
.scrim{position:absolute;inset:0;background:rgba(0,0,0,.5);display:grid;place-items:center;padding:24px}
.dialog{background:var(--surface-container);border-radius:20px;padding:22px;width:100%}
.dialog h3{font:900 28px/1 var(--display);text-transform:uppercase;margin-bottom:10px}
.dialog p{color:var(--on-surface-variant);font-size:15px}
.dialog .acts{display:flex;justify-content:flex-end;gap:8px;margin-top:20px;font:600 15px var(--text)}
.dialog .acts span{padding:10px 14px;border-radius:10px}
.dialog .acts .danger{background:var(--error);color:var(--surface)}
@media (max-width:420px){body{padding:16px 8px}figure{width:100%}}
</style>
</head>
<body>
<header class="intro">
  <h1>Performance</h1>
  <p>Die Strichliste vom Bierdeckel, als App. Flaschengrün und Bernstein, große schmale Ziffern wie auf einer Anzeigetafel, und jeder Zähler ist zusätzlich als Strichliste lesbar. Hell und dunkel folgen dem Handy.</p>
  <button id="toggle" type="button">Dunkel anzeigen</button>
</header>
<main class="wall" id="wall"></main>

<script>
const I={
 mug:"M5 3h11v3h2a3 3 0 0 1 3 3v4a3 3 0 0 1-3 3h-2v2a3 3 0 0 1-3 3H8a3 3 0 0 1-3-3V3m11 5v6h2a1 1 0 0 0 1-1V9a1 1 0 0 0-1-1h-2M7 5v13a1 1 0 0 0 1 1h5a1 1 0 0 0 1-1V5H7Z",
 podium:"M12 7.1 13.2 8l-.5-1.4 1.3-1h-1.5L12 4l-.5 1.6H10l1.3 1-.5 1.4L12 7.1M16 21H8v-11h8v11m-10 0H2v-7h4v7m16 0h-4v-9h4v9Z",
 cog:"M12 8a4 4 0 1 1 0 8 4 4 0 0 1 0-8m0 2a2 2 0 1 0 0 4 2 2 0 0 0 0-4m-2 12-.4-2.6a7 7 0 0 1-1.7-1l-2.4 1-2-3.4 2-1.6a7 7 0 0 1 0-2L3.500 8.800l2-3.400 2.400 1a7 7 0 0 1 1.700-1L10 3h4l.4 2.600a7 7 0 0 1 1.700 1l2.400-1 2 3.400-2 1.600a7 7 0 0 1 0 2l2 1.600-2 3.400-2.400-1a7 7 0 0 1-1.700 1L14 22h-4Z",
 back:"M20 11v2H8l5.500 5.500-1.420 1.420L4.160 12l7.920-7.920L13.500 5.500 8 11h12Z",
 user:"M12 4a4 4 0 1 1 0 8 4 4 0 0 1 0-8m0 2a2 2 0 1 0 0 4 2 2 0 0 0 0-4m0 7c2.670 0 8 1.330 8 4v3H4v-3c0-2.670 5.330-4 8-4m0 1.900c-2.970 0-6.100 1.460-6.100 2.100v1.100h12.200V17c0-.640-3.130-2.100-6.100-2.100Z",
 del:"M9 3v1H4v2h1v13a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V6h1V4h-5V3H9M7 6h10v13H7V6m2 2v9h2V8H9m4 0v9h2V8h-2Z",
 edit:"M14.060 9 15 9.940 5.920 19H5v-.920L14.060 9m3.600-6c-.250 0-.510.100-.700.290l-1.830 1.830 3.750 3.750 1.830-1.830a1 1 0 0 0 0-1.410l-2.340-2.340c-.200-.200-.450-.290-.710-.290m-3.600 3.190L3 17.250V21h3.750L17.810 9.940l-3.750-3.750Z",
 plus:"M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2Z",
 off:"M2.280 3 1 4.270l2.050 2.060A15.900 15.900 0 0 0 1 8l1.500 2a13.300 13.300 0 0 1 2.300-1.900l2.200 2.200A10.600 10.600 0 0 0 4 12l1.500 2a8 8 0 0 1 3.400-1.700l2.500 2.500A5.500 5.500 0 0 0 7 16l5 6 2.300-2.800 4.400 4.500L20 22.400 2.280 3M12 3c-2.200 0-4.300.4-6.200 1.200l1.700 1.700A14 14 0 0 1 21.500 10L23 8a16.400 16.400 0 0 0-11-5m0 5c-.400 0-.800 0-1.200.100l2.600 2.600c1.900.300 3.700 1 5.100 2.300L20 11a11.700 11.700 0 0 0-8-3Z"
};
const ic=n=>`<svg viewBox="0 0 24 24" aria-hidden="true"><path d="${I[n]}"/></svg>`;
// Strichliste: Fünferbündel, vier Striche plus Querstrich
function tally(n,h=22){
  n=Math.floor(n); if(n<=0) return "";
  let x=2,p="";
  for(let i=0;i<n;i++){
    const g=i%5;
    if(g<4){const j=((i*37)%5-2)*0.5; p+=`M${x+j} 2.500 L${x-j} ${h-2.500} `; x+=6;}
    else{ p+=`M${x-27} ${h-5} L${x-3} 5 `; x+=6; }
  }
  return `<svg class="tally" viewBox="0 0 ${x} ${h}" width="${x*h/22}" height="${h}" role="img" aria-label="${n} Striche"><path d="${p}" fill="none" stroke="currentColor" stroke-width="2.200" stroke-linecap="round"/></svg>`;
}
function tally2(o,n){const all=tally(o+n,34),old=tally(o,34);const w=x=>+x.match(/viewBox="0 0 (\d+)/)[1];return `<span class="t2" style="width:${w(all)*34/22}px"><span class="new">${all}</span><span class="old" style="width:${(w(old)-3)*34/22}px">${all}</span></span>`}
const nav=on=>`<nav class="nav">${[["Zählen","mug"],["Rangliste","podium"],["Verwalten","cog"]].map(([l,i])=>`<a href="#" class="${l===on?"on":""}"><span>${ic(i)}</span>${l}</a>`).join("")}</nav>`;
const bar=(t,ctx,back,extra="")=>`<div class="bar">${back?`<span class="icon">${ic("back")}</span>`:""}<h2>${t}${ctx?`<span class="ctx">${ctx}</span>`:""}</h2>${extra}<span class="icon">${ic("user")}</span></div>`;
const steps=n=>`<div class="steps">${[1,2,3,4].map(i=>`<i class="${i<=n?"on":""}"></i>`).join("")}</div>`;
const tot=`<span class="total"><b>13,5</b><small>Punkte heute</small></span>`;
const photos={Anna:"sunset",Daniel:"beer",Mara:"hills"};
const av=(n,s)=>`<span class="av ${photos[n]||""}" style="width:${s}px;height:${s}px;font-size:${Math.round(s*.42)}px" aria-hidden="true">${photos[n]?"":n[0]}</span>`;
const persons=[["Anna","9"],["Ben","3"],["Daniel","13,5"],["Jule",0],["Mara","6"],["Tom","0,5"]];
const drinks=[["Aperol",2,1],["Bier",1,4,"pressed"],["Margarita",3,1],["Radler","0,5",0],["Schnaps","1,5",2],["Wein",2,0]];

const screens=[
["Zählen · Für wen?",`${bar("Zählen")}${steps(1)}<div class="q">Für wen?</div><div class="body"><div class="grid">${persons.map(([n,c])=>`<button class="tile"><span class="top">${av(n,40)}<span class="name">${n}</span></span>${c?`<span class="row"><span class="sub">Punkte heute</span><span class="num">${c}</span></span>`:`<span class="sub">noch nichts</span>`}</button>`).join("")}</div></div><div class="snack">2× Bier · Happy Hour ×2 · Daniel<b>Rückgängig</b></div>${nav("Zählen")}`],
["Zählen · Welches Getränk?",`${bar("Daniel","",true,tot)}${steps(2)}<div class="q">Welches Getränk?</div><div class="body"><div class="grid">${drinks.map(([n,p,c,cls])=>`<button class="tile ${cls||""}"><span class="row"><span class="name">${n}</span><span class="num">${c||""}</span></span><span class="row"><span class="sub">${p} ${p===1?"Punkt":"Punkte"}</span>${tally(c,18)}</span></button>`).join("")}</div></div>${nav("Zählen")}`],
["Zählen · Wie viele?",`${bar("Daniel","Bier",true,tot)}${steps(3)}<div class="q">Wie viele?</div><div class="body"><div class="stepper"><button class="tile" aria-label="Eins weniger"><span class="num">−</span></button><div class="count"><b>6</b><small>Bier heute</small></div><button class="tile pressed" aria-label="Eins mehr"><span class="num">+</span></button></div><div class="delta">${tally2(4,2)}<span>bisher 4, neu dazu 2</span></div><div class="btn">Weiter</div></div>${nav("Zählen")}`],
["Zählen · Faktor? (offline)",`${bar("Daniel","2× Bier",true,tot)}${steps(4)}<div class="banner" style="margin-top:8px">${ic("off")}Offline. Getränke können gerade nicht gespeichert werden.</div><div class="q">Faktor?</div><div class="body"><div class="grid" style="grid-template-columns:1fr"><button class="tile off" disabled><span class="name">Kein Faktor</span><span class="sub">zählt einfach</span></button><button class="tile factor off" disabled><span class="row"><span class="name">Geburtstag</span><span class="num">×1,5</span></span><span class="sub">zählt 1,5-fach</span></button><button class="tile factor off" disabled><span class="row"><span class="name">Happy Hour</span><span class="num">×2</span></span><span class="sub">zählt 2-fach</span></button></div></div>${nav("Zählen")}`],
["Rangliste",`${bar("Rangliste","Heute",false,`<span class="stand">Stand: 23:41</span>`)}<div class="body" style="padding-top:8px"><div class="leader"><div class="top"><div>${av("Daniel",64)}<div class="name">Daniel</div>${tally(9,26)}</div><div class="score">13,5</div></div><div class="meta"><span>9 Getränke</span><span style="font-weight:400">Aperol 2 · Bier 4 · Margarita 1 · Schnaps 2</span></div></div>${[[2,"Anna","Bier 3 · Wein 3","9",6],[3,"Mara","Aperol 2 · Bier 2","6",4],[4,"Ben","Bier 3","3",3],[5,"Tom","Radler 1","0,5",1]].map(([p,n,s,sc,c])=>`<div class="rank"><div class="pos">${p}</div>${av(n,44)}<div><div class="name">${n}</div><div class="sub">${s}</div></div><div><div class="score">${sc}</div><div class="cnt">${c} ${c===1?"Getränk":"Getränke"}</div></div></div>`).join("")}</div>${nav("Rangliste")}`],
["Verlauf · Eintrag löschen",`${bar("Daniel","Heute",true)}<div class="body">${[["2× Bier","Happy Hour ×2 · 23:41 · anna"],["1× Margarita","Kein Faktor · 22:58 · daniel"],["2× Schnaps","Kein Faktor, 22:10, gelöschtes Konto"],["2× Aperol","Kein Faktor · 21:32 · anna"]].map(([t,s])=>`<div class="item"><div class="main"><div class="t">${t}</div><div class="s">${s}</div></div><span class="icon">${ic("del")}</span></div>`).join("")}</div>${nav("Rangliste")}<div class="scrim"><div class="dialog"><h3>Eintrag löschen?</h3><p>2× Bier · Happy Hour ×2 um 23:41</p><div class="acts"><span>Abbrechen</span><span class="danger">Löschen</span></div></div></div>`],
["Verwalten · Getränke",`${bar("Getränke","",true)}<div class="body">${drinks.map(([n,p])=>`<div class="item"><div class="main"><div class="t">${n}</div><div class="s">${p} ${p===1?"Punkt":"Punkte"}</div></div><span class="icon">${ic("edit")}</span><span class="icon">${ic("del")}</span></div>`).join("")}</div><div class="fab">${ic("plus")}Getränk anlegen</div>${nav("Verwalten")}`],
["Anmelden",`<div class="login"><h2>Perfor&shy;mance</h2>${tally(13,30)}<div class="field"><label>Benutzername</label><div>anna</div></div><div class="field focus"><label>Passwort</label><div>••••••••••••</div></div><div class="btn">Anmelden</div></div>`]
];
document.getElementById("wall").innerHTML=screens.map(([c,h])=>`<figure><figcaption>${c}</figcaption><div class="phone">${h}</div></figure>`).join("");
const root=document.documentElement,btn=document.getElementById("toggle");
const set=d=>{root.dataset.theme=d?"dark":"light";btn.textContent=d?"Hell anzeigen":"Dunkel anzeigen"};
set(matchMedia("(prefers-color-scheme: dark)").matches);
btn.addEventListener("click",()=>set(root.dataset.theme!=="dark"));
</script>
</body>
</html>
